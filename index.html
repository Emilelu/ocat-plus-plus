<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>OCAT++</title>
  <link rel="icon" href="https://writer.drakeet.com/images/orca_dark.png">
  <script>
    // 尽早恢复上次的主题/皮肤/缩放，避免加载闪烁
    try {
      var _ocatTheme = localStorage.getItem('ocat_theme');
      if (_ocatTheme) document.documentElement.setAttribute('data-theme', _ocatTheme);
      if (localStorage.getItem('ocat_skin') === 'glass') document.documentElement.setAttribute('data-skin', 'glass');
      var _ocatZoom = localStorage.getItem('ocat_zoom');
      if (_ocatZoom === null) _ocatZoom = (screen.width >= 3000) ? '1.25' : '1';   // 大屏默认放大
      if (parseFloat(_ocatZoom) !== 1) document.documentElement.style.zoom = _ocatZoom;
    } catch (e) {}
  </script>
  <script src="vendor/sql-wasm.js"></script>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/tiny-segmenter.js"></script>
  <script src="vendor/kuromoji.min.js"></script>
<style>
/* ============================================================
   Material Design 3 Tokens - Base (Light)
   ============================================================ */
:root {
  --md-sys-color-primary: #435e91;
  --md-sys-color-on-primary: #ffffff;
  --md-sys-color-primary-container: #d7e3ff;
  --md-sys-color-on-primary-container: #001a41;
  --md-sys-color-surface: #f8f9ff;
  --md-sys-color-surface-container: #eceff5;
  --md-sys-color-surface-container-high: #e6e9ef;
  --md-sys-color-on-surface: #191c20;
  --md-sys-color-on-surface-variant: #44474e;
  --md-sys-color-outline: #74777f;
  --md-sys-color-outline-variant: #c4c6d0;
  --md-sys-color-error: #ba1a1a;
  --md-sys-color-error-container: #ffdad6;
  --md-sys-color-success: #1b6d3f;
  --md-sys-color-success-container: #d2f7d9;
  --md-sys-elevation-1: 0 1px 2px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.04);
  --md-sys-elevation-2: 0 1px 2px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.04);
  --md-sys-elevation-3: 0 4px 8px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.06);
  --md-sys-state-hover: rgba(0,0,0,.04);
  --md-sys-state-focus: rgba(0,0,0,.08);
  --md-sys-state-pressed: rgba(0,0,0,.10);
  --md-sys-shape-corner-xs: 4px;
  --md-sys-shape-corner-s: 8px;
  --md-sys-shape-corner-m: 12px;
  --md-sys-shape-corner-l: 16px;
  --md-sys-shape-corner-xl: 24px;
  --md-sys-shape-corner-full: 9999px;
  --md-sys-typescale-body-small: 400 .75rem/1.25rem "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --md-sys-typescale-body-medium: 400 .875rem/1.5rem "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --md-sys-typescale-body-large: 400 1rem/1.5rem "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --md-sys-typescale-label-small: 500 .6875rem/1rem "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --md-sys-typescale-label-medium: 500 .75rem/1rem "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --md-sys-typescale-label-large: 500 .875rem/1.25rem "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --md-sys-typescale-title-small: 500 .875rem/1.25rem "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --md-sys-typescale-title-medium: 500 1rem/1.5rem "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --md-sys-typescale-title-large: 400 1.375rem/1.75rem "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --md-sys-typescale-headline-small: 400 1.5rem/2rem "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --font-ja: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "Noto Sans SC", sans-serif;
  --md-sys-motion-duration-short: 200ms;
  --md-sys-motion-duration-medium: 400ms;
  --md-sys-motion-duration-long: 600ms;
  --md-sys-motion-easing-standard: cubic-bezier(.2, 0, 0, 1);
  --md-sys-motion-easing-emphasized: cubic-bezier(.05, .7, .1, 1);
}

/* System dark mode */
@media (prefers-color-scheme: dark) {
  :root {
    --md-sys-color-primary: #aac7ff;
    --md-sys-color-on-primary: #002f65;
    --md-sys-color-primary-container: #2a4678;
    --md-sys-color-on-primary-container: #d7e3ff;
    --md-sys-color-surface: #111318;
    --md-sys-color-surface-container: #1d2025;
    --md-sys-color-surface-container-high: #272b30;
    --md-sys-color-on-surface: #e2e2e9;
    --md-sys-color-on-surface-variant: #c4c6d0;
    --md-sys-color-outline: #8e9099;
    --md-sys-color-outline-variant: #44474e;
    --md-sys-color-error: #ffb4ab;
    --md-sys-color-error-container: #93000a;
    --md-sys-color-success: #81c995;
    --md-sys-color-success-container: #00391c;
    --md-sys-elevation-1: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.15);
    --md-sys-elevation-2: 0 1px 2px rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.15);
    --md-sys-elevation-3: 0 4px 8px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.2);
    --md-sys-state-hover: rgba(255,255,255,.04);
    --md-sys-state-focus: rgba(255,255,255,.08);
    --md-sys-state-pressed: rgba(255,255,255,.10);
  }
}

/* Manual dark override */
[data-theme="dark"] {
  --md-sys-color-primary: #aac7ff;
  --md-sys-color-on-primary: #002f65;
  --md-sys-color-primary-container: #2a4678;
  --md-sys-color-on-primary-container: #d7e3ff;
  --md-sys-color-surface: #111318;
  --md-sys-color-surface-container: #1d2025;
  --md-sys-color-surface-container-high: #272b30;
  --md-sys-color-on-surface: #e2e2e9;
  --md-sys-color-on-surface-variant: #c4c6d0;
  --md-sys-color-outline: #8e9099;
  --md-sys-color-outline-variant: #44474e;
  --md-sys-color-error: #ffb4ab;
  --md-sys-color-error-container: #93000a;
  --md-sys-color-success: #81c995;
  --md-sys-color-success-container: #00391c;
  --md-sys-elevation-1: 0 1px 2px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.15);
  --md-sys-elevation-2: 0 1px 2px rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.15);
  --md-sys-elevation-3: 0 4px 8px rgba(0,0,0,.3), 0 1px 3px rgba(0,0,0,.2);
  --md-sys-state-hover: rgba(255,255,255,.04);
  --md-sys-state-focus: rgba(255,255,255,.08);
  --md-sys-state-pressed: rgba(255,255,255,.10);
}

/* Manual light override */
[data-theme="light"] {
  --md-sys-color-primary: #435e91;
  --md-sys-color-on-primary: #ffffff;
  --md-sys-color-primary-container: #d7e3ff;
  --md-sys-color-on-primary-container: #001a41;
  --md-sys-color-surface: #f8f9ff;
  --md-sys-color-surface-container: #eceff5;
  --md-sys-color-surface-container-high: #e6e9ef;
  --md-sys-color-on-surface: #191c20;
  --md-sys-color-on-surface-variant: #44474e;
  --md-sys-color-outline: #74777f;
  --md-sys-color-outline-variant: #c4c6d0;
  --md-sys-color-error: #ba1a1a;
  --md-sys-color-error-container: #ffdad6;
  --md-sys-color-success: #1b6d3f;
  --md-sys-color-success-container: #d2f7d9;
  --md-sys-elevation-1: 0 1px 2px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.04);
  --md-sys-elevation-2: 0 1px 2px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.04);
  --md-sys-elevation-3: 0 4px 8px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.06);
  --md-sys-state-hover: rgba(0,0,0,.04);
  --md-sys-state-focus: rgba(0,0,0,.08);
  --md-sys-state-pressed: rgba(0,0,0,.10);
}

/* ============================================================
   Icon Font (Material Icons — 本地 vendor/，离线可用)
   ============================================================ */
@font-face {
  font-family: 'Material Icons';
  font-style: normal;
  font-weight: 400;
  src: url('vendor/material-icons.woff2') format('woff2');
}
.mi {
  font-family: 'Material Icons';
  font-weight: normal; font-style: normal;
  font-size: 20px; line-height: 1;
  letter-spacing: normal; text-transform: none;
  display: inline-block; white-space: nowrap; word-wrap: normal;
  direction: ltr; font-feature-settings: 'liga';
  -webkit-font-smoothing: antialiased;
  user-select: none; -webkit-user-select: none; flex-shrink: 0;
}

/* ============================================================
   Base
   ============================================================ */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font: var(--md-sys-typescale-body-medium);
  background: var(--md-sys-color-surface);
  color: var(--md-sys-color-on-surface);
  height: 100vh; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ============================================================
   Top App Bar
   ============================================================ */
.top-bar {
  height: 64px; background: var(--md-sys-color-surface);
  display: flex; align-items: center; padding: 0 16px; gap: 16px; z-index: 10;
  position: relative;
}
.top-bar h1 { font: var(--md-sys-typescale-title-large); flex-shrink: 0; }
.top-bar .db-chip {
  display: flex; align-items: center; gap: 6px; padding: 4px 12px;
  border-radius: var(--md-sys-shape-corner-s); font: var(--md-sys-typescale-label-medium);
  background: var(--md-sys-color-error-container); color: var(--md-sys-color-error);
  transition: all var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
}
.top-bar .db-chip.loaded { background: var(--md-sys-color-success-container); color: var(--md-sys-color-success); }
.top-bar .stats { font: var(--md-sys-typescale-body-small); color: var(--md-sys-color-on-surface-variant); margin-left: auto; }

/* Material Buttons */
.md-btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 24px;
  border: none; border-radius: var(--md-sys-shape-corner-full); cursor: pointer;
  font: var(--md-sys-typescale-label-large); letter-spacing: .01em;
  transition: all var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
  position: relative; overflow: hidden; user-select: none;
}
.md-btn::after {
  content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity var(--md-sys-motion-duration-short);
}
.md-btn:hover::after { opacity: 1; background: var(--md-sys-state-hover); }
.md-btn:active::after { opacity: 1; background: var(--md-sys-state-pressed); }

.md-btn-filled {
  background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary);
  box-shadow: var(--md-sys-elevation-1);
}
.md-btn-filled:hover { box-shadow: var(--md-sys-elevation-2); }

.md-btn-tonal {
  background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container);
}
.md-btn-outlined {
  background: transparent; color: var(--md-sys-color-primary);
  border: 1px solid var(--md-sys-color-outline);
}
.md-btn-text {
  background: transparent; color: var(--md-sys-color-primary); padding: 10px 12px;
}

.md-btn-icon {
  width: 40px; height: 40px; padding: 0;
  border-radius: var(--md-sys-shape-corner-full);
  justify-content: center; background: transparent;
  flex-shrink: 0;
}
.md-btn-icon .mi { font-size: 20px; }

.md-btn-sm { padding: 6px 16px; font: var(--md-sys-typescale-label-medium); }
.md-btn-sm .mi { font-size: 16px; }

/* 统一交互反馈 */
.md-btn:active { transform: scale(.95); }
.md-btn, .md-chip, .nav-rail-item, .nav-chip, .pager-btn {
  -webkit-tap-highlight-color: transparent;
}
.md-btn:focus-visible, .md-chip:focus-visible, .nav-rail-item:focus-visible,
.modal-close:focus-visible, .pager-btn:focus-visible {
  outline: 2px solid var(--md-sys-color-primary); outline-offset: 2px;
}

/* ============================================================
   Search Bar
   ============================================================ */
.search-bar {
  height: 56px; background: var(--md-sys-color-surface);
  display: flex; align-items: center; padding: 0 16px; gap: 8px;
}
.search-field {
  flex: 1; display: flex; align-items: center; height: 40px;
  background: var(--md-sys-color-surface-container-high);
  border-radius: var(--md-sys-shape-corner-full); padding: 0 16px; gap: 8px;
  transition: all var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
  border: 1px solid transparent;
}
.search-field:focus-within {
  background: var(--md-sys-color-surface);
  border-color: var(--md-sys-color-primary);
  box-shadow: var(--md-sys-elevation-1);
}
.search-field svg { flex-shrink: 0; color: var(--md-sys-color-on-surface-variant); }
.search-field input {
  flex: 1; border: none; background: transparent; outline: none;
  font: var(--md-sys-typescale-body-large); color: var(--md-sys-color-on-surface);
  min-width: 80px;
}
.search-field input::placeholder { color: var(--md-sys-color-on-surface-variant); }

.md-select {
  height: 40px; padding: 0 12px; border: 1px solid var(--md-sys-color-outline);
  border-radius: var(--md-sys-shape-corner-s); font: var(--md-sys-typescale-body-medium);
  background: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface);
  cursor: pointer; outline: none; transition: border-color var(--md-sys-motion-duration-short);
}
.md-select:focus { border-color: var(--md-sys-color-primary); }

.search-hint { font: var(--md-sys-typescale-body-small); color: var(--md-sys-color-on-surface-variant); white-space: nowrap; }

/* ============================================================
   Main Layout
   ============================================================ */
.main { display: flex; height: calc(100% - 120px); }

/* Navigation Rail */
.nav-rail {
  width: 120px; min-width: 60px;
  background: var(--md-sys-color-surface-container);
  display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 4px;
  overflow-y: auto; overflow-x: hidden; flex-shrink: 0;
}
.nav-rail-resizer {
  width: 4px; cursor: col-resize; flex-shrink: 0;
  background: var(--md-sys-color-outline-variant);
  transition: background .2s;
}
.nav-rail-resizer:hover, .nav-rail-resizer.active { background: var(--md-sys-color-primary); }
.nav-search { width: 100%; padding: 2px 8px 8px; flex-shrink: 0; }
.nav-search-field {
  display: flex; align-items: center; gap: 4px; height: 32px; padding: 0 10px;
  background: var(--md-sys-color-surface-container-high);
  border-radius: var(--md-sys-shape-corner-full);
}
.nav-search-field .mi { font-size: 16px; color: var(--md-sys-color-on-surface-variant); }
.nav-search-field input {
  border: none; background: transparent; outline: none; width: 100%; min-width: 0;
  font: var(--md-sys-typescale-body-small); color: var(--md-sys-color-on-surface);
}
.nav-search-field input::placeholder { color: var(--md-sys-color-on-surface-variant); }
.nav-rail-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 12px 4px; width: 100%; border-radius: var(--md-sys-shape-corner-l);
  cursor: pointer; transition: all var(--md-sys-motion-duration-short);
  font: var(--md-sys-typescale-label-small); text-align: center;
  color: var(--md-sys-color-on-surface-variant); position: relative;
}
.nav-rail-item:hover { background: var(--md-sys-state-hover); }
.nav-rail-item.active { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }
.nav-rail-item .nav-icon { font-size: 24px; line-height: 1; flex-shrink: 0; }
.nav-rail-item .nav-label {
  width: 100%; padding: 0 4px; word-break: break-all; line-height: 1.3;
}
.nav-rail-item .nav-badge {
  position: absolute; top: 6px; right: 6px; min-width: 16px; height: 16px;
  border-radius: var(--md-sys-shape-corner-full); background: var(--md-sys-color-error);
  color: var(--md-sys-color-on-primary); font-size: 10px; display: flex; align-items: center; justify-content: center;
  padding: 0 4px;
}

/* Content Area */
.content-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* Sheet (right panel) */
.sheet {
  flex: 1; display: flex; flex-direction: column; overflow: hidden;
  background: var(--md-sys-color-surface); border-radius: var(--md-sys-shape-corner-l) 0 0 0;
}

/* Toolbar */
.toolbar {
  padding: 8px 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  border-bottom: 1px solid var(--md-sys-color-outline-variant);
  background: var(--md-sys-color-surface);
}
.toolbar .title { font: var(--md-sys-typescale-title-medium); }
.toolbar .count { font: var(--md-sys-typescale-body-small); color: var(--md-sys-color-on-surface-variant); }
.toolbar .spacer { flex: 1; }

/* Filter chips */
.filter-chips {
  padding: 8px 16px; display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid var(--md-sys-color-outline-variant);
}
.md-chip {
  display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px;
  border-radius: var(--md-sys-shape-corner-s); cursor: pointer;
  font: var(--md-sys-typescale-label-medium); transition: all var(--md-sys-motion-duration-short);
  border: 1px solid var(--md-sys-color-outline); background: transparent;
  color: var(--md-sys-color-on-surface); user-select: none;
}
.md-chip:hover { background: var(--md-sys-state-hover); }
.md-chip.selected {
  background: var(--md-sys-color-primary-container);
  color: var(--md-sys-color-on-primary-container);
  border-color: transparent;
}
.md-chip .chip-icon { font-size: 18px; }

/* Section nav */
.section-nav {
  padding: 4px 16px; display: flex; gap: 6px; flex-wrap: wrap;
  border-bottom: 1px solid var(--md-sys-color-outline-variant);
}
.section-nav .nav-chip {
  padding: 4px 12px; border-radius: var(--md-sys-shape-corner-s);
  font: var(--md-sys-typescale-label-medium); white-space: nowrap; cursor: pointer;
  transition: all var(--md-sys-motion-duration-short); flex-shrink: 0;
  color: var(--md-sys-color-on-surface-variant);
}
.section-nav .nav-chip:hover { background: var(--md-sys-state-hover); }
.section-nav .nav-chip.active {
  background: var(--md-sys-color-primary-container);
  color: var(--md-sys-color-on-primary-container);
}

/* Scrollable list */
.scroll-list { flex: 1; overflow-y: auto; padding: 8px 16px; }

/* Playback Bar */
.playback-bar {
  background: var(--md-sys-color-surface-container-high);
  border-top: 1px solid var(--md-sys-color-outline-variant);
  padding: 6px 16px; display: flex; align-items: center; gap: 6px;
  flex-shrink: 0;
}
.playback-bar .md-btn { min-width: 40px; width: 40px; height: 40px; padding: 0; justify-content: center; }
.playback-bar .pb-play {
  background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary);
  box-shadow: var(--md-sys-elevation-1);
}
.playback-bar .pb-play:hover { box-shadow: var(--md-sys-elevation-2); }
.playback-bar .pb-mode.active { color: var(--md-sys-color-primary); }

/* ============================================================
   Conversation Card
   ============================================================ */
.conv-card {
  background: var(--md-sys-color-surface-container);
  border-radius: var(--md-sys-shape-corner-m); margin-bottom: 8px;
  overflow: hidden; transition: all var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
  animation: card-in var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-emphasized) both;
  /* 长列表性能：屏外卡片跳过渲染布局 */
  content-visibility: auto;
  contain-intrinsic-size: auto 96px;
}
@keyframes card-in {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
.conv-card:hover { box-shadow: var(--md-sys-elevation-1); }
.conv-card.selected {
  outline: 2px solid var(--md-sys-color-primary);
  outline-offset: -2px;
}

.conv-card-header {
  padding: 12px 16px; cursor: pointer; display: flex; align-items: flex-start; gap: 12px;
  transition: background var(--md-sys-motion-duration-short);
}
.conv-card-header:hover { background: var(--md-sys-state-hover); }

/* Checkbox */
.md-checkbox, .sen-checkbox, .conv-checkbox {
  appearance: none; -webkit-appearance: none;
  width: 18px; height: 18px; flex-shrink: 0; cursor: pointer;
  border: 2px solid var(--md-sys-color-outline);
  border-radius: 3px; background: transparent;
  position: relative; transition: all .15s;
}
.md-checkbox:checked, .sen-checkbox:checked, .conv-checkbox:checked {
  background: var(--md-sys-color-primary);
  border-color: var(--md-sys-color-primary);
}
.md-checkbox:checked::after, .sen-checkbox:checked::after, .conv-checkbox:checked::after {
  content: ''; position: absolute; left: 4px; top: 1px;
  width: 6px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
.sen-checkbox { width: 16px; height: 16px; }
.sen-checkbox:checked::after { left: 3px; top: 0; width: 5px; height: 9px; }

.conv-card-body { flex: 1; min-width: 0; }

.collection-badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px;
  border-radius: var(--md-sys-shape-corner-xs); font: var(--md-sys-typescale-label-small);
  background: var(--md-sys-color-primary-container);
  color: var(--md-sys-color-on-primary-container); margin-bottom: 6px;
}

.conv-question {
  font: var(--md-sys-typescale-body-medium); margin-bottom: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.conv-summary {
  font: var(--md-sys-typescale-body-small); color: var(--md-sys-color-on-surface-variant);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

.conv-card-meta {
  display: flex; align-items: center; gap: 8px; margin-top: 6px;
  font: var(--md-sys-typescale-label-small); color: var(--md-sys-color-on-surface-variant);
  flex-shrink: 0;
}

.conv-card-actions {
  display: flex; gap: 4px; flex-shrink: 0; margin-left: 8px;
}

/* Expanded sentences - smooth grid animation */
.conv-sentences {
  display: grid; grid-template-rows: 0fr;
  transition: grid-template-rows var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-standard);
  border-top: 1px solid transparent;
  transition: grid-template-rows var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-standard),
              border-color var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-standard);
}
.conv-card.expanded .conv-sentences {
  grid-template-rows: 1fr;
  border-top-color: var(--md-sys-color-outline-variant);
}
.conv-sentences-inner { overflow: hidden; }

.sentence-row {
  padding: 10px 16px 10px 48px; display: flex; align-items: flex-start; gap: 10px;
  transition: background var(--md-sys-motion-duration-short);
}
.sentence-row:hover { background: var(--md-sys-state-hover); }
.sentence-row.playing { background: var(--md-sys-color-primary-container); border-left: 3px solid var(--md-sys-color-primary); }
.sentence-row + .sentence-row { border-top: 1px solid var(--md-sys-color-outline-variant); }

.sentence-row .sen-content { flex: 1; }
.sentence-row .sen-ja {
  font-family: var(--font-ja); font-size: 15px; line-height: 2.5; margin-bottom: 2px;
}
/* 自定义注音：rt 绝对定位悬浮在汉字上方，完全不参与排版，
   因此不会像原生 ruby 那样把正文挤开或错位 */
.sentence-row .sen-ja .rb {
  position: relative; display: inline-block;
}
.sentence-row .sen-ja .rb .rt {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(100% - .55em);
  font-family: var(--font-ja); font-size: .55em; line-height: 1.3;
  color: var(--md-sys-color-on-surface-variant);
  text-align: center; white-space: nowrap;
  pointer-events: none;
  user-select: none; -webkit-user-select: none;
}
.sentence-row .sen-ruby { font: var(--md-sys-typescale-body-small); color: var(--md-sys-color-on-surface-variant); }
.sentence-row .sen-zh { font: var(--md-sys-typescale-body-medium); color: var(--md-sys-color-on-surface-variant); }
.sentence-row .sen-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.sentence-row .sen-tag {
  padding: 2px 8px; border-radius: var(--md-sys-shape-corner-xs);
  font: var(--md-sys-typescale-label-small); background: var(--md-sys-color-primary-container);
  color: var(--md-sys-color-on-primary-container);
}
.sentence-row .sen-tag.mastered {
  background: var(--md-sys-color-success-container); color: var(--md-sys-color-success);
}
.sentence-row .sen-lookup {
  color: var(--md-sys-color-on-surface-variant);
  cursor: pointer; white-space: nowrap; flex-shrink: 0;
  width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--md-sys-shape-corner-full);
  transition: background var(--md-sys-motion-duration-short), color var(--md-sys-motion-duration-short);
}
.sentence-row .sen-lookup .mi { font-size: 18px; }
.sentence-row .sen-lookup:hover { background: var(--md-sys-state-hover); color: var(--md-sys-color-primary); }
.sentence-row .sen-lookup.sen-mastered.on { color: var(--md-sys-color-success); }
.sentence-row .sen-lookup.sen-mastered.on:hover { color: var(--md-sys-color-error); }

/* ============================================================
   Section Group
   ============================================================ */
.section-group {
  margin-bottom: 12px; border-radius: var(--md-sys-shape-corner-m);
  overflow: hidden; background: var(--md-sys-color-surface-container);
}
.section-group-header {
  padding: 12px 16px; cursor: pointer; display: flex; align-items: center; gap: 8px;
  font: var(--md-sys-typescale-title-small); transition: background var(--md-sys-motion-duration-short);
  user-select: none;
}
.section-group-header:hover { background: var(--md-sys-state-hover); }
.section-group-header .section-arrow {
  transition: transform var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-standard);
  font-size: 12px; color: var(--md-sys-color-on-surface-variant);
}
.section-group.collapsed .section-arrow { transform: rotate(-90deg); }
.section-group-header .section-count { font: var(--md-sys-typescale-label-small); color: var(--md-sys-color-on-surface-variant); margin-left: auto; }
.section-group-body {
  transition: max-height var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-standard);
  max-height: 9999px; overflow: hidden;
}
.section-group.collapsed .section-group-body { max-height: 0; }

/* ============================================================
   Modal / Dialog
   ============================================================ */
.modal-scrim {
  position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100;
  display: flex; align-items: center; justify-content: center;
  animation: fade-in var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
  transition: opacity 160ms var(--md-sys-motion-easing-standard);
}
.modal-scrim.closing { opacity: 0; pointer-events: none; }
.modal-scrim.closing .modal-dialog {
  opacity: 0; transform: scale(.96) translateY(16px);
  transition: opacity 160ms var(--md-sys-motion-easing-standard), transform 160ms var(--md-sys-motion-easing-standard);
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
.modal-dialog {
  background: var(--md-sys-color-surface-container-high);
  border-radius: var(--md-sys-shape-corner-xl); max-width: 720px; width: 90%;
  max-height: 85vh; display: flex; flex-direction: column;
  box-shadow: var(--md-sys-elevation-3);
  animation: dialog-in var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-emphasized);
}
@keyframes dialog-in {
  from { opacity: 0; transform: scale(.95) translateY(24px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-header {
  padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--md-sys-color-outline-variant);
}
.modal-header h3 { font: var(--md-sys-typescale-title-medium); }
.modal-close {
  width: 40px; height: 40px; border-radius: var(--md-sys-shape-corner-full);
  border: none; background: transparent; cursor: pointer; font-size: 20px;
  display: flex; align-items: center; justify-content: center;
  color: var(--md-sys-color-on-surface-variant);
  transition: background var(--md-sys-motion-duration-short);
}
.modal-close:hover { background: var(--md-sys-state-hover); }
.modal-body {
  padding: 24px; overflow-y: auto; flex: 1;
  font: var(--md-sys-typescale-body-medium); line-height: 1.7;
}

/* Markdown content in modal */
.modal-body .md-content { }
.modal-body .md-content h2 { font: var(--md-sys-typescale-title-medium); margin: 16px 0 8px; }
.modal-body .md-content h3 { font: var(--md-sys-typescale-label-large); margin: 12px 0 6px; }
.modal-body .md-content p { margin: 8px 0; }
.modal-body .md-content strong { font-weight: 600; }
.modal-body .md-content hr { border: none; border-top: 1px solid var(--md-sys-color-outline-variant); margin: 16px 0; }
.modal-body .md-content code {
  font-family: var(--font-ja); background: var(--md-sys-color-surface-container);
  padding: 2px 6px; border-radius: var(--md-sys-shape-corner-xs); font-size: .9em;
}
.modal-body .md-content lang, .lang-block {
  display: block; font-family: var(--font-ja); font-size: 1.05em;
  padding: 8px 12px; margin: 8px 0; background: var(--md-sys-color-surface-container);
  border-radius: var(--md-sys-shape-corner-s); border-left: 3px solid var(--md-sys-color-primary);
}
.lang-block[data-lang]::before {
  content: attr(data-lang); display: block;
  font: var(--md-sys-typescale-label-small); color: var(--md-sys-color-primary);
  margin-bottom: 6px; text-transform: uppercase;
}
.modal-body .md-content ul, .modal-body .md-content ol { padding-left: 20px; margin: 8px 0; }
.modal-body .md-content li { margin: 4px 0; }
.modal-body .user-q {
  padding: 12px 16px; background: var(--md-sys-color-primary-container);
  border-radius: var(--md-sys-shape-corner-m); margin-bottom: 16px;
  font: var(--md-sys-typescale-body-large);
}
.modal-body .user-q .label { font: var(--md-sys-typescale-label-small); opacity: .7; margin-bottom: 4px; }

/* ============================================================
   Snackbar / Toast
   ============================================================ */
.snackbar {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--md-sys-color-inverse-surface);
  color: var(--md-sys-color-inverse-on-surface);
  padding: 12px 24px; border-radius: var(--md-sys-shape-corner-s);
  font: var(--md-sys-typescale-body-medium); z-index: 200;
  box-shadow: var(--md-sys-elevation-2); cursor: pointer;
  white-space: nowrap; max-width: 80vw; overflow: hidden; text-overflow: ellipsis;
  animation: snackbar-in var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-standard);
  transition: opacity var(--md-sys-motion-duration-long);
}
@keyframes snackbar-in { from { opacity: 0; transform: translateX(16px); } }
.snackbar.hiding { opacity: 0; }

/* ============================================================
   Empty State
   ============================================================ */
.empty-state {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; color: var(--md-sys-color-on-surface-variant); gap: 16px;
  text-align: center; padding: 32px; padding-top: 80px;
}
.empty-state .icon { font-size: 64px; opacity: .4; line-height: 1; }
.empty-state .title { font: var(--md-sys-typescale-title-medium); margin-top: 8px; }
.empty-state .desc { font: var(--md-sys-typescale-body-medium); }

/* ============================================================
   Pitch Popup
   ============================================================ */
.pitch-popup {
  position: absolute; z-index: 200;
  background: var(--md-sys-color-surface-container-high);
  border-radius: var(--md-sys-shape-corner-m); padding: 12px 16px;
  box-shadow: var(--md-sys-elevation-3); font: var(--md-sys-typescale-body-medium);
  animation: fade-in var(--md-sys-motion-duration-short);
  min-width: 200px; max-width: 320px;
}
.pitch-popup .popup-word {
  font-family: var(--font-ja); font-size: 16px; font-weight: 600;
  margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--md-sys-color-outline-variant);
}
.pitch-popup a {
  color: var(--md-sys-color-primary); text-decoration: none;
  display: flex; align-items: center; gap: 6px; padding: 4px 0;
  font: var(--md-sys-typescale-body-medium);
}
.pitch-popup a:hover { color: var(--md-sys-color-on-primary-container); }

/* ============================================================
   Pagination (B站风格：首页/末页常驻、当前页居中窗口、前后翻页)
   ============================================================ */
.pager-btn {
  min-width: 32px; height: 30px; padding: 0 6px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: var(--md-sys-shape-corner-s); cursor: pointer;
  font: var(--md-sys-typescale-label-medium);
  color: var(--md-sys-color-on-surface-variant);
  user-select: none; transition: background var(--md-sys-motion-duration-short), color var(--md-sys-motion-duration-short);
}
.pager-btn:hover { background: var(--md-sys-state-hover); color: var(--md-sys-color-on-surface); }
.pager-btn.active { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); font-weight: 600; }
.pager-btn.disabled { opacity: .35; pointer-events: none; }
.pager-ellipsis { padding: 0 2px; color: var(--md-sys-color-on-surface-variant); user-select: none; }

/* ============================================================
   Scrollbar
   ============================================================ */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--md-sys-color-outline-variant); border-radius: 2px; }
::-webkit-scrollbar-thumb:hover { background: var(--md-sys-color-outline); }

/* ============================================================
   Skin: 液态玻璃 (html[data-skin="glass"])
   半透明表面 + 背景 blur，卡片不加 blur（性能友好）
   ============================================================ */
html[data-skin="glass"] :is(.top-bar, .search-bar, .toolbar, .filter-chips, .section-nav,
    .playback-bar, #paginationBar, .nav-rail, .modal-dialog, .pitch-popup, .snackbar) {
  backdrop-filter: blur(28px) saturate(1.7);
  -webkit-backdrop-filter: blur(28px) saturate(1.7);
}
html[data-skin="glass"] .conv-card,
html[data-skin="glass"] .section-group {
  border: 1px solid rgba(255,255,255,.55);
  box-shadow: 0 6px 24px rgba(60,70,130,.10);
}
html[data-skin="glass"] .conv-card:hover { box-shadow: 0 8px 30px rgba(60,70,130,.16); }

/* --- 浅色玻璃 --- */
html[data-skin="glass"] body {
  background:
    radial-gradient(1200px 800px at 88% -10%, rgba(122,152,255,.32), transparent 60%),
    radial-gradient(1000px 700px at -10% 110%, rgba(140,214,196,.30), transparent 60%),
    linear-gradient(135deg, #dde6fa 0%, #f2e6f5 52%, #dcefec 100%);
  background-attachment: fixed;
}
html[data-skin="glass"] {
  --md-sys-color-surface: rgba(255,255,255,.42);
  --md-sys-color-surface-container: rgba(255,255,255,.52);
  --md-sys-color-surface-container-high: rgba(255,255,255,.62);
  --md-sys-color-primary-container: rgba(210,224,255,.72);
  --md-sys-color-success-container: rgba(206,246,214,.75);
  --md-sys-color-error-container: rgba(255,216,212,.8);
}

/* --- 深色玻璃 --- */
html[data-skin="glass"][data-theme="dark"] body {
  background:
    radial-gradient(1200px 800px at 88% -10%, rgba(96,116,220,.28), transparent 60%),
    radial-gradient(1000px 700px at -10% 110%, rgba(52,150,140,.22), transparent 60%),
    linear-gradient(135deg, #10131c 0%, #171527 52%, #0e1a1c 100%);
  background-attachment: fixed;
}
html[data-skin="glass"][data-theme="dark"] {
  --md-sys-color-surface: rgba(22,24,33,.5);
  --md-sys-color-surface-container: rgba(30,33,45,.55);
  --md-sys-color-surface-container-high: rgba(38,42,56,.6);
  --md-sys-color-primary-container: rgba(64,86,138,.6);
  --md-sys-color-success-container: rgba(24,66,40,.6);
  --md-sys-color-error-container: rgba(120,20,26,.55);
}
html[data-skin="glass"][data-theme="dark"] .conv-card,
html[data-skin="glass"][data-theme="dark"] .section-group {
  border-color: rgba(255,255,255,.09);
  box-shadow: 0 6px 24px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark) {
  html[data-skin="glass"]:not([data-theme="light"]) body {
    background:
      radial-gradient(1200px 800px at 88% -10%, rgba(96,116,220,.28), transparent 60%),
      radial-gradient(1000px 700px at -10% 110%, rgba(52,150,140,.22), transparent 60%),
      linear-gradient(135deg, #10131c 0%, #171527 52%, #0e1a1c 100%);
    background-attachment: fixed;
  }
  html[data-skin="glass"]:not([data-theme="light"]) {
    --md-sys-color-surface: rgba(22,24,33,.5);
    --md-sys-color-surface-container: rgba(30,33,45,.55);
    --md-sys-color-surface-container-high: rgba(38,42,56,.6);
    --md-sys-color-primary-container: rgba(64,86,138,.6);
    --md-sys-color-success-container: rgba(24,66,40,.6);
    --md-sys-color-error-container: rgba(120,20,26,.55);
  }
  html[data-skin="glass"]:not([data-theme="light"]) .conv-card,
  html[data-skin="glass"]:not([data-theme="light"]) .section-group {
    border-color: rgba(255,255,255,.09);
    box-shadow: 0 6px 24px rgba(0,0,0,.35);
  }
}
</style>
</head>
<body>

<div class="top-bar">
  <h1 style="display:flex;align-items:center;gap:8px;cursor:pointer" onclick="document.querySelector('.nav-rail').scrollTop=0" title="点击回到顶部">
    <img src="https://writer.drakeet.com/images/orca_dark.png" width="28" height="28" style="border-radius:4px" alt="OCAT">
    OCAT++
  </h1>
  <button class="md-btn md-btn-icon" onclick="toggleTheme()" title="切换深浅色模式" id="themeBtn"></button>
  <button class="md-btn md-btn-icon" onclick="toggleSkin()" title="切换皮肤" id="skinBtn"></button>
  <select class="md-select" id="zoomSelect" onchange="applyZoom(this.value)" title="界面缩放（大屏幕可调大）" style="height:36px">
    <option value="1">100%</option>
    <option value="1.1">110%</option>
    <option value="1.25">125%</option>
    <option value="1.5">150%</option>
    <option value="1.75">175%</option>
  </select>
  <span class="db-chip" id="dbStatus">未加载</span>
  <button class="md-btn md-btn-filled" onclick="openDatabase()"><span class="mi">folder_open</span>选择数据库</button>
  <button class="md-btn md-btn-tonal" onclick="syncFromPhone()" title="通过 ADB 从手机同步最新数据库"><span class="mi">sync</span>同步手机</button>
  <span class="stats" id="headerStats"></span>
  <button class="md-btn md-btn-icon md-btn-outlined" onclick="openImportDialog()" title="从其他数据库导入收藏夹"><span class="mi">move_to_inbox</span></button>
  <button class="md-btn md-btn-icon md-btn-outlined" onclick="saveDatabase()" title="保存数据库到文件"><span class="mi">save</span></button>
  <button class="md-btn md-btn-icon md-btn-outlined" onclick="clearCache()" title="清除缓存重新解析"><span class="mi">refresh</span></button>
</div>

<div class="search-bar">
  <div class="search-field">
    <span class="mi">search</span>
    <input type="text" id="searchInput" placeholder="搜索句子、翻译、用户提问、AI回答…（按 / 聚焦）" disabled>
  </div>
  <select class="md-select" id="searchField">
    <option value="all">全部字段</option>
    <option value="content">日语句子</option>
    <option value="translation">中文翻译</option>
    <option value="question">用户提问</option>
    <option value="answer">AI回答</option>
  </select>
  <select class="md-select" id="searchScope">
    <option value="current">当前收藏夹</option>
    <option value="all">全部收藏夹</option>
  </select>
  <span class="search-hint" id="searchHint"></span>
</div>

<div class="main">
  <div class="nav-rail" id="navRail">
    <div class="nav-search">
      <div class="nav-search-field">
        <span class="mi">search</span>
        <input type="text" id="navSearch" placeholder="搜索收藏夹" disabled>
      </div>
    </div>
  </div>
  <div class="nav-rail-resizer" id="navResizer"></div>

  <div class="content-area">
    <div class="sheet">
      <div class="toolbar" id="toolbar">
        <span class="title" id="toolbarTitle">请选择数据库文件</span>
        <span class="count" id="toolbarCount"></span>
        <span class="spacer"></span>
        <button class="md-btn md-btn-outlined md-btn-sm" onclick="toggleSelectAll()" title="全选当前收藏夹的所有句子（跨收藏夹搜索时为全部搜索结果）">全选</button>
        <button class="md-btn md-btn-text md-btn-sm" onclick="deselectAll()" title="清空所有勾选">取消</button>
        <button class="md-btn md-btn-filled md-btn-sm" id="btnExportAnki" onclick="exportAnki()" disabled><span class="mi">file_download</span>Anki</button>
        <button class="md-btn md-btn-outlined md-btn-sm" id="btnExportCSV" onclick="exportCSV()" disabled>CSV</button>
        <button class="md-btn md-btn-text md-btn-sm" id="btnExportTXT" onclick="exportTXT()" disabled>TXT</button>
      </div>

      <div class="filter-chips" id="filterChips" style="display:none">
        <div class="md-chip" id="chipMastered" onclick="toggleFilter('mastered')">
          <span class="mi chip-icon">check_circle</span> 已掌握
        </div>
        <div class="md-chip" id="chipHasTags" onclick="toggleFilter('hasTags')">
          <span class="mi chip-icon">label</span> 有标签
        </div>
      </div>

      <div class="section-nav" id="sectionNav" style="display:none"></div>

      <div class="scroll-list" id="convList">
        <div class="empty-state">
          <div class="icon mi">folder_open</div>
          <div class="title">欢迎使用 OCAT++</div>
          <div class="desc">点击上方「选择数据库」加载 SQLite DB 文件</div>
        </div>
      </div>

      <!-- Playback Bar -->
      <div id="pbBar" class="playback-bar">
        <span style="font:var(--md-sys-typescale-label-small);margin-right:4px">倍速</span>
        <input type="range" id="speedSlider" min="0.5" max="2.0" step="0.05" value="1.25"
          oninput="speechRate=parseFloat(this.value);document.getElementById('speedLabel').textContent=speechRate.toFixed(2)+'x';store.set('rate',speechRate)"
          style="width:80px;accent-color:var(--md-sys-color-primary)">
        <span id="speedLabel" style="font:var(--md-sys-typescale-label-small);min-width:36px">1.25x</span>
        <select id="voiceSelect" onchange="selectedVoiceURI=this.value;store.set('voice',selectedVoiceURI);if(isPlaying&&!window.speechSynthesis.paused){window.speechSynthesis.cancel();speakCurrent();}" style="max-width:140px;height:28px;font-size:11px;border:1px solid var(--md-sys-color-outline);border-radius:4px;background:var(--md-sys-color-surface);color:var(--md-sys-color-on-surface)"><option value="">自动</option></select>
        <div style="flex:1"></div>
        <button class="md-btn" onclick="skipPrev()" title="上一句"><span class="mi">skip_previous</span></button>
        <button class="md-btn pb-play" id="playBtn" onclick="togglePlay()" title="播放"><span class="mi">play_arrow</span></button>
        <button class="md-btn" onclick="skipNext()" title="下一句"><span class="mi">skip_next</span></button>

};

let db = null;
let dbFileName = 'OCAT.db';
let dbDirty = false;          // 浏览器内数据与磁盘文件不一致（如导入后未保存）
let DATA = [];
let currentCollection = null;
let selectedConvs = new Set();
let selectedSentences = new Set();
let expandedConvs = new Set();

let filterHasTags = false;

let currentPage = 1;
let PAGE_SIZE = parseInt(store.get('pagesize', '50'), 10) || 50;

// db 状态芯片统一入口（含「未保存更改」提示）
function setDbChip(text, loaded) {
  const el = document.getElementById('dbStatus');
  if (!el) return;

  el.className = 'db-chip' + (loaded ? ' loaded' : '');
  el.title = loaded && dbDirty ? '浏览器内的数据包含尚未写回磁盘文件的更改，请点击右上角保存按钮' : '';

// Configure marked
if (typeof marked !== 'undefined') marked.setOptions({ breaks: true, gfm: true });

// ============================================================
// DB
// ============================================================
async function syncFromPhone() {
  if (typeof initSqlJs === 'undefined') { snackbar('核心库 vendor/sql-wasm.js 未加载，请检查项目文件'); return; }
  try {
    dbDirty = false;
    setDbChip('同步中...', false);
    const resp = await fetch('http://localhost:8899/api/sync', { signal: AbortSignal.timeout(30000) });
    if (resp.ok) {
      const buf = await resp.arrayBuffer();
      const SQL = await initSqlJs({ locateFile: f => `vendor/${f}` });
      db = new SQL.Database(new Uint8Array(buf));
      setDbChip('已同步', true);
      document.getElementById('searchInput').disabled = false;
      await loadAllData();
      cacheData('OCAT.db', false);
      snackbar('已从手机同步最新数据库', true);
      return;
    }
    // 服务器返回了错误信息
    const err = await resp.json().catch(() => ({}));
    snackbar('同步失败: ' + (err.error || '未知错误'));
    if (!db) setDbChip('未加载', false); else setDbChip(dbFileName, true);
  } catch {
    // 网络错误：服务器未启动
    showSyncHelp();
  }
}

function copySyncCmd() {
  const dir = decodeURIComponent(window.location.href.replace('/index.html','').replace('file:///',''));
  const cmd = `cmd /c "cd /d ${dir} && python sync_server.py"`;
  const ta = document.createElement('textarea');
  ta.value = cmd; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); snackbar('已复制命令'); } catch(e) { snackbar('复制失败，请手动复制'); }
  document.body.removeChild(ta);
}

function showSyncHelp() {
  if (!db) setDbChip('未加载', false);   // 已有数据库加载时不要误清状态
  const dir = decodeURIComponent(window.location.href.replace('/index.html','').replace('file:///',''));
  const cmd = `cmd /c "cd /d ${dir} && python sync_server.py"`;
  document.getElementById('modalBody').innerHTML = `
    <div style="text-align:center;padding:16px">
      <div style="font-size:48px;margin-bottom:12px"><span class="mi" style="font-size:48px">smartphone</span></div>
      <div style="font:var(--md-sys-typescale-title-medium);margin-bottom:8px">同步服务未启动</div>
      <div style="font:var(--md-sys-typescale-body-medium);color:var(--md-sys-color-on-surface-variant);margin-bottom:12px">请在新终端运行以下命令：</div>
      <div style="background:var(--md-sys-color-surface-container);padding:10px 14px;border-radius:8px;font-family:Consolas,monospace;font-size:13px;margin-bottom:12px;text-align:left;user-select:all">${cmd}</div>
      <button class="md-btn md-btn-filled" onclick="copySyncCmd();closeModal()">📋 复制</button>
      <button class="md-btn md-btn-text" onclick="closeModal()" style="margin-left:8px">关闭</button>
    </div>`;
  document.getElementById('modalOverlay').style.display = 'flex';
}

async function saveDatabase() {
  if (!db) { snackbar('请先加载一个数据库'); return; }
  const data = db.export();
  // Chromium：直接写回文件（可覆盖原文件，免去手动替换）
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: dbFileName || 'OCAT.db',
        types: [{ description: 'SQLite 数据库', accept: { 'application/octet-stream': ['.db'] } }]
      });
      const w = await handle.createWritable();
      await w.write(data);
      await w.close();
      dbDirty = false;
      setDbChip(handle.name, true);
      cacheData(dbFileName || 'OCAT.db', false);
      snackbar('已保存到 ' + handle.name, true);
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return;   // 用户取消
      // 其他错误走下载兜底
    }
  }
  const blob = new Blob([data], { type: 'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = dbFileName || 'OCAT.db';
  a.click();
  URL.revokeObjectURL(url);
  dbDirty = false;
  setDbChip(dbFileName || '已加载', true);
  cacheData(dbFileName || 'OCAT.db', false);
  snackbar('数据库已导出，请替换原文件', true);
}

async function openImportDialog() {
  if (!db) { snackbar('请先加载一个数据库'); return; }
  if (typeof initSqlJs === 'undefined') { snackbar('核心库 vendor/sql-wasm.js 未加载，请检查项目文件'); return; }

    srcDb.close();
    if (!collections.length || !collections[0].values.length) { snackbar('源数据库中没有收藏夹'); return; }
    const rows = collections[0].values;
    let html = '<div style="padding:16px"><div style="font:var(--md-sys-typescale-title-medium);margin-bottom:12px">选择要导入的收藏夹</div>';
    html += rows.map((r, i) => `<label style="display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer">
      <input type="checkbox" class="md-checkbox" checked data-id="${r[0]}">
      <span>${escHtml(r[1])} <span style="color:var(--md-sys-color-on-surface-variant);font-size:12px">${r[2] || ''} ${r[3] ? '→ '+r[3] : ''}</span></span>
    </label>`).join('');
    html += `<div style="margin-top:16px;display:flex;gap:8px">
      <button class="md-btn md-btn-filled" onclick="importSelectedCollections('${file.name}')">确认导入</button>
      <button class="md-btn md-btn-text" onclick="closeModal()">取消</button>
    </div></div>`;
    document.getElementById('modalBody').innerHTML = html;
    document.getElementById('modalOverlay').style.display = 'flex';
    // 保存源文件数据供后续使用
    window._importBuf = buf;
    window._importRows = rows;

async function importSelectedCollections(fileName) {
  if (!db || !window._importBuf) return;
  if (typeof initSqlJs === 'undefined') { snackbar('核心库 vendor/sql-wasm.js 未加载，请检查项目文件'); return; }
  const selectedIds = Array.from(document.querySelectorAll('#modalBody input[type=checkbox]:checked')).map(cb => cb.dataset.id);
  if (!selectedIds.length) { snackbar('请选择至少一个收藏夹'); return; }
  closeModal();
  const SQL = await initSqlJs({ locateFile: f => `vendor/${f}` });
  const srcDb = new SQL.Database(new Uint8Array(window._importBuf));
  let imported = 0, skipped = 0;
  db.run('BEGIN TRANSACTION');
  try {
    for (const colId of selectedIds) {
      // 检查是否已存在
      const existing = db.exec(`SELECT id FROM CollectionList WHERE id = '${colId}'`);
      if (existing.length && existing[0].values.length) { skipped++; continue; }
      // 复制 CollectionList
      const cl = srcDb.exec(`SELECT * FROM CollectionList WHERE id = '${colId}'`);
      if (!cl.length || !cl[0].values.length) continue;
      const clRow = cl[0].values[0];
      const clCols = cl[0].columns;
      // 转义保留字段名（index 是 SQLite 保留字）
      const clEscaped = clCols.map(c => `\`${c}\``).join(',');
      db.run(`INSERT OR IGNORE INTO CollectionList (${clEscaped}) VALUES (${clRow.map(v => v === null ? 'NULL' : `'${String(v).replace(/'/g,"''")}'`).join(',')})`);
      // 复制 Collection
      const colls = srcDb.exec(`SELECT * FROM Collection WHERE collectionListId = '${colId}' AND deleted = 0`);
      if (colls.length) {
        const cCols = colls[0].columns;
        const cEscaped = cCols.map(c => `\`${c}\``).join(',');
        for (const row of colls[0].values) {
          db.run(`INSERT OR IGNORE INTO Collection (${cEscaped}) VALUES (${row.map(v => v === null ? 'NULL' : `'${String(v).replace(/'/g,"''")}'`).join(',')})`);
        }
      }
      // 复制 LocalMessage
      const msgs = srcDb.exec(`SELECT * FROM LocalMessage WHERE id IN (SELECT messageId FROM Collection WHERE collectionListId = '${colId}' AND messageId IS NOT NULL)`);
      if (msgs.length) {
        const mCols = msgs[0].columns;
        const mEscaped = mCols.map(c => `\`${c}\``).join(',');
        for (const row of msgs[0].values) {
          db.run(`INSERT OR IGNORE INTO LocalMessage (${mEscaped}) VALUES (${row.map(v => v === null ? 'NULL' : `'${String(v).replace(/'/g,"''")}'`).join(',')})`);
        }
      }
      imported++;
    }
    db.run('COMMIT');
    srcDb.close();
    delete window._importBuf;
    delete window._importRows;
    dbDirty = true;   // 导入只写进了浏览器内存/缓存，磁盘文件还没更新
    setDbChip(dbFileName || '已加载', true);
    snackbar(`成功导入 ${imported} 个收藏夹` + (skipped ? `，${skipped} 个已存在跳过` : '') + (imported ? '，记得点击保存' : ''), imported > 0);
    // 重新加载数据
    await loadAllData();
    cacheData(dbFileName || 'OCAT.db', true);
    renderNav();
    if (currentCollection) {
      applyFilters();
    }
  } catch(e) {
    db.run('ROLLBACK');
    srcDb.close();
    snackbar('导入失败: ' + e.message);
  }
}

async function openDatabase() {
  const input = document.createElement('input');

async function loadDB(buf, name) {
  const SQL = await initSqlJs({ locateFile: f => `vendor/${f}` });
  db = new SQL.Database(new Uint8Array(buf));
  dbDirty = false;
  setDbChip(name || '已加载', true);

  await loadAllData();
  snackbar('数据库加载成功', true);
}

// IndexedDB 缓存 — 缓存解析后的 DATA + 原始 DB 字节（让缓存会话也支持编辑/保存）
function cacheData(name, dirty = dbDirty) {
  const req = indexedDB.open('ocat_cache', 1);
  req.onupgradeneeded = () => { req.result.createObjectStore('data'); };
  req.onsuccess = () => {
    let raw = null;
    try { raw = db ? db.export() : null; } catch (e) { raw = null; }
    const tx = req.result.transaction('data', 'readwrite');
    tx.objectStore('data').put({ data: DATA, raw, name, time: Date.now(), dirty: !!dirty }, 'current');
    tx.oncomplete = () => req.result.close();
  };
}

async function loadCachedData() {
  return new Promise((resolve) => {
    const req = indexedDB.open('ocat_cache', 1);
    req.onupgradeneeded = () => { req.result.createObjectStore('data'); };
    req.onsuccess = () => {
      const tx = req.result.transaction('data', 'readonly');
      const get = tx.objectStore('data').get('current');
      get.onsuccess = () => { req.result.close(); resolve(get.result); };
      get.onerror = () => { req.result.close(); resolve(null); };
    };
    req.onerror = () => resolve(null);
  });
}

// 启动：优先加载缓存数据，否则需要手动选择数据库
(async function() {
  // 初始化 kuromoji
  if (typeof kuromoji !== 'undefined') {
    try {
      window._kuromojiTokenizer = await new Promise((resolve, reject) => {
        kuromoji.builder({ dicPath: 'https://cdn.jsdelivr.net/npm/kuromoji@0.1.2/dict/' }).build((err, tokenizer) => {
          if (err) reject(err); else resolve(tokenizer);
        });
      });
    } catch(e) {}
  }
  // 尝试加载缓存数据
  const cached = await loadCachedData();
  if (cached && cached.data && cached.data.length > 0) {
    DATA = cached.data;
    dbDirty = !!cached.dirty;
    dbFileName = cached.name || 'OCAT.db';
    // 用缓存的原始字节重建内存数据库 → 缓存会话同样可以编辑/保存
    if (cached.raw && typeof initSqlJs !== 'undefined') {
      try {
        const SQL = await initSqlJs({ locateFile: f => `vendor/${f}` });
        db = new SQL.Database(cached.raw);
      } catch (e) { console.warn('缓存数据库重建失败', e); }
    }
    document.getElementById('searchInput').disabled = false;
    renderNav();
    const totalC = DATA.reduce((s, c) => s + allConvs(c).length, 0);
    const totalS = DATA.reduce((s, c) => s + allConvs(c).reduce((t, cv) => t + cv.sentences.length, 0), 0);
    document.getElementById('headerStats').textContent = `${DATA.length} 收藏夹 · ${totalC} 对话 · ${totalS} 句`;
    const age = Math.round((Date.now() - cached.time) / 60000);
    setDbChip((cached.name || '已缓存') + (age > 0 ? ` (${age}分钟前)` : ''), true);
  }
})();

function q(sql, params = []) {
  if (!db) return [];
  const stmt = db.prepare(sql);
  if (params.length) stmt.bind(params);
  const rows = [];
  while (stmt.step()) rows.push(stmt.getAsObject());
  stmt.free();
  return rows;
}

// ============================================================
// Data Load
// ============================================================
async function loadAllData() {
  const collections = q(`SELECT id, title, summary, lang, translationLang FROM CollectionList WHERE deleted = 0 ORDER BY "index"`);
  const colMap = {};
  collections.forEach(c => { colMap[c.id] = { ...c, conversations: [], sections: null, hasSections: false }; });

  const sentences = q(`SELECT id, "index", content, translation, ruby, lang, isMastered, tags, collectionListId, messageId, createdAt, type FROM Collection WHERE deleted = 0 ORDER BY collectionListId, messageId, "index"`);

  const messages = {};
  q(`SELECT id, authorId, text, contextMessageId, contextMessageText, model, createdAt FROM LocalMessage`).forEach(m => { messages[m.id] = { ...m }; });

  const convMap = {};
  sentences.forEach(s => {
    if (!colMap[s.collectionListId]) return;
    const key = `${s.collectionListId}|${s.messageId || ''}`;
    if (!convMap[key]) convMap[key] = [];
    convMap[key].push({
      id: s.id, content: s.content || '', translation: s.translation || '',
      ruby: rubyToBrackets(s.ruby), lang: s.lang || '',
      isMastered: !!s.isMastered, tags: s.tags || '',
      createdAt: s.createdAt || 0, type: s.type || '', index: s.index,
    });
  });

  for (const clid of Object.keys(colMap)) {
    const allItems = [];
    for (const [key, sens] of Object.entries(convMap)) {
      const [convClid, msgid] = key.split('|', 2);
      if (convClid !== clid) continue;
      const sections = sens.filter(s => s.type === 'section');
      const normals = sens.filter(s => s.type !== 'section');
      let userQ = '', aiA = '', model = '';
      if (msgid && messages[msgid]) {
        const aiMsg = messages[msgid];
        aiA = aiMsg.text || '';  // 完整 AI 回复
        model = aiMsg.model || '';
        if (aiMsg.contextMessageId && messages[aiMsg.contextMessageId]) {
          userQ = messages[aiMsg.contextMessageId].text || '';
        }
      }
      if (sections.length) {
        sections.forEach(sec => allItems.push({ idx: sec.index, isSection: true, title: sec.content, conv: { messageId: msgid, userQuestion: '', aiAnswer: '', aiSummary: '', model: '', sentences: [] } }));
      } else if (normals.length) {
        allItems.push({ idx: normals[0].index, isSection: false, title: '', conv: { messageId: msgid, userQuestion: userQ, aiAnswer: aiA, aiSummary: aiA.substring(0, 250), model, sentences: normals } });
      }
    }
    if (!allItems.length) continue;
    allItems.sort((a, b) => a.idx - b.idx);
    const hasSections = allItems.some(it => it.isSection);
    if (hasSections) {
      const sections = []; let cur = null;
      allItems.forEach(it => {
        if (it.isSection) { cur = { title: it.title, conversations: [] }; sections.push(cur); }
        else if (cur) cur.conversations.push(it.conv);
        else { if (!sections.length) sections.push({ title: '', conversations: [] }); sections[0].conversations.push(it.conv); }
      });
      colMap[clid].sections = sections; colMap[clid].hasSections = true;
    } else {
      colMap[clid].conversations = allItems.map(it => it.conv);
    }
  }

  DATA = Object.values(colMap).filter(c => c.hasSections ? c.sections?.length : c.conversations?.length);
  renderNav();
  const totalC = DATA.reduce((s, c) => s + allConvs(c).length, 0);
  const totalS = DATA.reduce((s, c) => s + allConvs(c).reduce((t, cv) => t + cv.sentences.length, 0), 0);
  document.getElementById('headerStats').textContent = `${DATA.length} 收藏夹 · ${totalC} 对话 · ${totalS} 句`;
}

function allConvs(col) {
  return col.hasSections ? col.sections.flatMap(s => s.conversations) : col.conversations;
}

function renderNav() {
  const nav = document.getElementById('navRail');

  nav.querySelectorAll('.nav-rail-item').forEach(el => el.remove());

    const totalS = allConvs(col).reduce((t, c) => t + c.sentences.length, 0);
    const langLabel = col.lang === 'ja' ? '日' : col.lang === 'en' ? '英' : col.lang === 'zh' ? '中' : '';
    const langColors = { ja: '#e74c3c', en: '#3498db', zh: '#e67e22' };
    const langBg = langColors[col.lang] || '#8e9099';
    return `<div class="nav-rail-item" data-idx="${i}" data-title="${escAttr(col.title)}" title="${escAttr(col.title)} (${totalS} 句)">
      <span class="nav-icon" style="width:32px;height:32px;border-radius:50%;background:${langBg};color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0">${langLabel || '<span class="mi" style="font-size:16px">folder</span>'}</span>
      <span class="nav-label">${escHtml(col.title)}</span>
      ${totalS > 99 ? `<span class="nav-badge">${totalS > 999 ? '999+' : totalS}</span>` : ''}
    </div>`;
  }).join('');
  nav.insertAdjacentHTML('beforeend', itemsHTML);
  if (search && search.value.trim()) filterNavCollections(search.value);
}

function filterNavCollections(kw) {

    el.style.display = !q || (el.dataset.title || '').toLowerCase().includes(q) ? '' : 'none';
