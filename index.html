function selectCollection(idx) {
  currentCollection = DATA[idx];
  isCrossSearch = false;
  document.querySelectorAll('.nav-rail-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`.nav-rail-item[data-idx="${idx}"]`).classList.add('active');
  document.getElementById('toolbarTitle').textContent = currentCollection.title;
  document.getElementById('filterChips').style.display = 'flex';
  document.getElementById('sectionNav').style.display = 'none';
  document.getElementById('sectionNav').innerHTML = '';
  if (currentCollection.hasSections) {
    document.getElementById('sectionNav').style.display = 'flex';
  }
  selectedConvs.clear(); selectedSentences.clear(); expandedConvs.clear(); collapsedSections.clear();
  currentPage = 1; activeSectionIdx = -1;
  // 重置播放
  stopSpeech(); currentSpeechIndex = -1; window.fullPlaylist = []; window._shuffleRecent = [];
  // 有分栏的收藏夹：默认折叠除第一个外的所有分栏
  if (currentCollection.hasSections && currentCollection.sections) {
    currentCollection.sections.forEach((sec, i) => {
      if (i > 0) collapsedSections.add(`sec-${i}`);
    });
  }
  document.getElementById('searchInput').value = '';
  document.getElementById('searchScope').value = 'current';
  document.getElementById('convList').scrollTop = 0;
  // 预展开无用户提问的对话
  const allConvsList = allConvs(currentCollection);
  allConvsList.forEach((conv, i) => {
    if (i === 0 || !conv.userQuestion || conv.sentences.some(s => s.tags)) {
      expandedConvs.add(conv.messageId);
    }
  });
  applyFilters();
}

// ============================================================
// Filters
// ============================================================
function toggleFilter(type) {
  if (type === 'mastered') { filterMastered = !filterMastered; document.getElementById('chipMastered').classList.toggle('selected', filterMastered); }
  if (type === 'hasTags') { filterHasTags = !filterHasTags; document.getElementById('chipHasTags').classList.toggle('selected', filterHasTags); }
  applyFilters();
}

// ============================================================
// Search
// ============================================================
function onSearch() {
  const scope = document.getElementById('searchScope').value;
  const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
  if (scope === 'all' && keyword) { crossSearch(keyword); return; }
  if (!currentCollection) return;
  isCrossSearch = false;
  document.getElementById('sectionNav').style.display = currentCollection.hasSections ? 'flex' : 'none';
  document.getElementById('filterChips').style.display = 'flex';
  applyFilters();
}

function crossSearch(keyword) {
  isCrossSearch = true;
  const field = document.getElementById('searchField').value;
  const results = [];

  for (const col of DATA) {
    for (const conv of allConvs(col)) {
      for (const s of conv.sentences) {
        if (s.type === 'section') continue;
        let match = false;
        if (field === 'all') match = (s.content + s.translation + conv.userQuestion + conv.aiAnswer).toLowerCase().includes(keyword);
        else if (field === 'content') match = s.content.toLowerCase().includes(keyword);
        else if (field === 'translation') match = s.translation.toLowerCase().includes(keyword);
        else if (field === 'question') match = conv.userQuestion.toLowerCase().includes(keyword);
        else if (field === 'answer') match = conv.aiAnswer.toLowerCase().includes(keyword);
        if (match) {
          // 去重：同个对话只保留一次
          const key = `${col.id}|${conv.messageId}`;
          if (!results.find(r => r.key === key)) {
            results.push({ key, collection: col, conv: { ...conv, sentences: [s] } });
          } else {
            const existing = results.find(r => r.key === key);
            existing.conv.sentences.push(s);
          }
        }
      }
    }
  }

  document.getElementById('sectionNav').style.display = 'none';
  document.getElementById('filterChips').style.display = 'none';
  document.getElementById('toolbarTitle').textContent = `跨收藏夹搜索`;
  document.getElementById('toolbarCount').textContent = `${results.length} 个对话`;
  document.getElementById('searchHint').textContent = `在 ${DATA.length} 个收藏夹中找到 ${results.reduce((s, r) => s + r.conv.sentences.length, 0)} 条句子`;
  window._searchResults = results;

  const container = document.getElementById('convList');
  if (results.length === 0) {
    window.currentRenderItems = [];
    window.currentRenderer = null;
    buildFullPlaylist();
    const oldPager0 = document.getElementById('paginationBar');
    if (oldPager0) oldPager0.remove();
    container.innerHTML = `<div class="empty-state"><div class="icon mi">search</div><div class="title">没有匹配的结果</div></div>`;
    return;
  }

  const capped = results.slice(0, 300);
  _renderPageAt(capped, container, r => renderConvItem(r.conv, r.collection), 1);
  buildFullPlaylist();

  if (results.length > 300) {
    container.innerHTML += `<div style="padding:16px;text-align:center;color:var(--md-sys-color-on-surface-variant)">仅显示前 300 个对话，请缩小搜索范围</div>`;
  }
}

function applyFilters() {
  if (isCrossSearch) return;
  if (!currentCollection) return;
  const wasPlaying = isPlaying;
  const savedSid = (window.fullPlaylist || [])[currentSpeechIndex]?.id ?? null;
  const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
  const field = document.getElementById('searchField').value;
  const convs = allConvs(currentCollection);

  if (currentCollection.hasSections) {
    let filteredSections = [];
    for (const sec of currentCollection.sections) {
      let filteredConvs = [];
      for (const conv of sec.conversations) {
        let sentences = conv.sentences.filter(s => s.type !== 'section');
        if (filterMastered) sentences = sentences.filter(s => s.isMastered);
        if (filterHasTags) sentences = sentences.filter(s => s.tags);
        if (keyword) sentences = sentences.filter(s => matchSentence(s, conv, keyword, field));
        if (sentences.length > 0) filteredConvs.push({ ...conv, sentences });
      }
      filteredSections.push({ ...sec, conversations: filteredConvs });
    }
    renderSections(filteredSections);
    const total = filteredSections.reduce((s, sec) => s + sec.conversations.reduce((t, c) => t + c.sentences.length, 0), 0);
    document.getElementById('toolbarCount').textContent = `${filteredSections.length} 分栏 · ${total} 句`;
    document.getElementById('toolbarTitle').textContent = currentCollection.title;
  } else {
    let filteredConvs = [];
    for (const conv of convs) {
      let sentences = conv.sentences;
      if (filterMastered) sentences = sentences.filter(s => s.isMastered);
      if (filterHasTags) sentences = sentences.filter(s => s.tags);
      if (keyword) sentences = sentences.filter(s => matchSentence(s, conv, keyword, field));
      if (sentences.length > 0) filteredConvs.push({ ...conv, sentences });
    }
    renderConversations(filteredConvs);
    document.getElementById('toolbarCount').textContent = `${filteredConvs.length} 对话 · ${filteredConvs.reduce((s, c) => s + c.sentences.length, 0)} 句`;
    document.getElementById('toolbarTitle').textContent = currentCollection.title;
  }
  document.getElementById('searchHint').textContent = keyword ? '找到匹配结果' : '';
  updateToolbar();
  buildFullPlaylist();
  // 恢复播放高亮：尽量定位回原来那句
  if (wasPlaying && window.fullPlaylist.length) {
    let idx = savedSid != null
      ? window.fullPlaylist.findIndex(it => String(it.id) === String(savedSid))
      : -1;
    if (idx < 0) idx = Math.min(Math.max(currentSpeechIndex, 0), window.fullPlaylist.length - 1);
    currentSpeechIndex = idx;
    highlightCurrentSentence();
  }
}

function matchSentence(s, conv, keyword, field) {
  if (field === 'all') return (s.content + s.translation + conv.userQuestion + conv.aiAnswer).toLowerCase().includes(keyword);
  if (field === 'content') return s.content.toLowerCase().includes(keyword);
  if (field === 'translation') return s.translation.toLowerCase().includes(keyword);
  if (field === 'question') return conv.userQuestion.toLowerCase().includes(keyword);
  if (field === 'answer') return conv.aiAnswer.toLowerCase().includes(keyword);
  return false;
}

// ============================================================
// Render
// ============================================================
function renderConversations(convs) {
  currentPage = Math.min(currentPage, Math.ceil(convs.length / PAGE_SIZE) || 1);
  const container = document.getElementById('convList');
  if (convs.length === 0) {
    window.currentRenderItems = []; window.currentRenderer = null;
    buildFullPlaylist();
    const oldPager = document.getElementById('paginationBar');
    if (oldPager) oldPager.remove();
    container.innerHTML = `<div class="empty-state"><div class="icon mi">search</div><div class="title">没有匹配的结果</div></div>`;
    return;
  }
  _renderPageAt(convs.map(c => ({ conv: c })), container, (item) => renderConvItem(item.conv), currentPage);
}

// 分栏视图 → 扁平列表（带 conv 引用，供播放列表/分页定位使用）
function buildSectionFlatItems(sections) {
  const flatItems = [];
  sections.forEach((sec, si) => {
    const convCount = sec.conversations.length;
    const senCount = sec.conversations.reduce((t, c) => t + c.sentences.length, 0);
    const secId = `sec-${si}`;
    const isCollapsed = collapsedSections.has(secId);
    flatItems.push({
      type: 'section',
      html: `<div class="section-group ${isCollapsed ? 'collapsed' : ''}" id="${secId}">
        <div class="section-group-header">
          <span class="section-arrow"><span class="mi" style="font-size:14px">expand_more</span></span>
          <span class="mi" style="font-size:16px;color:var(--md-sys-color-primary)">folder</span>
          ${escHtml(sec.title || '(未分类)')}
          <span class="section-count">${convCount} 对话 · ${senCount} 句</span>
        </div>
        <div class="section-group-body">`
    });
    sec.conversations.forEach(c => flatItems.push({ type: 'conv', html: renderConvItem(c), conv: c }));
    flatItems.push({ type: 'close', html: '</div></div>' });
  });
  return flatItems;
}

function renderSections(sections) {
  const container = document.getElementById('convList');
  const navContainer = document.getElementById('sectionNav');
  if (sections.length === 0) {
    window.currentRenderItems = []; window.currentRenderer = null;
    buildFullPlaylist();
    const oldPager = document.getElementById('paginationBar');
    if (oldPager) oldPager.remove();
    container.innerHTML = `<div class="empty-state"><div class="icon mi">search</div><div class="title">没有匹配的结果</div></div>`;
    navContainer.style.display = 'none';
    return;
  }
  navContainer.style.display = 'flex';
  navContainer.innerHTML = sections.map((sec, si) =>
    `<span class="nav-chip ${si === activeSectionIdx ? 'active' : ''}" data-sec="sec-${si}">${escHtml(sec.title || '(未分类)')}</span>`
  ).join('');

  const flatItems = buildSectionFlatItems(sections);
  currentPage = Math.min(currentPage, Math.ceil(flatItems.length / PAGE_SIZE) || 1);
  _renderPageAt(flatItems, container, (item) => item.html, currentPage);
}

function _renderPageAt(items, container, renderer, page) {
  // 保存引用供分页按钮使用
  window.currentRenderItems = items;
  window.currentRenderer = renderer;
  currentPage = page;
  const total = items.length;
  const totalPages = Math.ceil(total / PAGE_SIZE);
  const start = (page - 1) * PAGE_SIZE;
  const end = Math.min(start + PAGE_SIZE, total);
  const slice = items.slice(start, end);
  container.innerHTML = slice.map(renderer).join('');
  renderPage = end;

  // 移除旧分页
  const oldPager = document.getElementById('paginationBar');
  if (oldPager) oldPager.remove();

  if (totalPages > 1) {
    const pager = document.createElement('div');
    pager.id = 'paginationBar';
    pager.style.cssText = 'background:var(--md-sys-color-surface);border-top:1px solid var(--md-sys-color-outline-variant);padding:8px 16px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;flex-shrink:0';
    pager.innerHTML = _buildPagerHTML(page, totalPages);
    container.parentElement.appendChild(pager);
    const sizeSel = pager.querySelector('#pageSizeSelect');
    if (sizeSel) sizeSel.onchange = () => {
      PAGE_SIZE = parseInt(sizeSel.value, 10);
      store.set('pagesize', PAGE_SIZE);
      buildFullPlaylist();
      goToPage(1);
      if (isPlaying) highlightCurrentSentence();
    };
    const jump = pager.querySelector('#pageJump');
    if (jump) jump.onkeydown = (e) => {
      if (e.key === 'Enter') goToPage(parseInt(jump.value, 10) || page);
    };
  }
}

// 跳转到指定页（自动夹紧范围）
function goToPage(p) {
  const items = window.currentRenderItems;
  if (!items || !items.length) return;
  const totalPages = Math.ceil(items.length / PAGE_SIZE) || 1;
  p = Math.max(1, Math.min(totalPages, parseInt(p, 10) || 1));
  const pager = document.getElementById('paginationBar');
  if (pager) pager.remove();
  _renderPageAt(items, document.getElementById('convList'), window.currentRenderer, p);
}

function _buildPagerHTML(page, totalPages) {
  let html = '';

  // 每页条数选择
  html += `<select class="md-select" style="height:28px;font-size:12px" id="pageSizeSelect" title="每页条数">
    ${[25,50,100,200].map(n => `<option value="${n}" ${PAGE_SIZE===n?'selected':''}>${n}条/页</option>`).join('')}
  </select>`;

  // 上一页
  html += `<span class="pager-btn ${page <= 1 ? 'disabled' : ''}" data-page="${page - 1}" title="上一页"><span class="mi" style="font-size:18px">chevron_left</span></span>`;

  // 页码（B站风格窗口）
  const pages = _getPageRange(page, totalPages);
  pages.forEach(p => {
    if (p === '...') html += '<span class="pager-ellipsis">…</span>';
    else html += `<span class="pager-btn ${p === page ? 'active' : ''}" data-page="${p}">${p}</span>`;
  });

  // 下一页
  html += `<span class="pager-btn ${page >= totalPages ? 'disabled' : ''}" data-page="${page + 1}" title="下一页"><span class="mi" style="font-size:18px">chevron_right</span></span>`;

  // 跳转
  html += `<input type="number" min="1" max="${totalPages}" id="pageJump" placeholder="${page}/${totalPages}"
    style="width:60px;height:28px;border:1px solid var(--md-sys-color-outline);border-radius:6px;text-align:center;font-size:12px"
    title="输入页码后回车跳转">`;

  return html;
}

// B站风格：固定 7 个页码的滑动窗口（当前页尽量居中），首页/末页常驻，其余以省略号收拢
function _getPageRange(page, total) {
  if (total <= 7) return Array.from({ length: total }, (_, i) => i + 1);
  let start = Math.max(1, page - 3);
  let end = Math.min(total, start + 6);
  start = Math.max(1, end - 6);
  const pages = [];
  if (start > 1) { pages.push(1); if (start > 2) pages.push('...'); }
  for (let i = start; i <= end; i++) pages.push(i);
  if (end < total) { if (end < total - 1) pages.push('...'); pages.push(total); }
  return pages;
}

function stripMarkdown(text) {
  if (!text) return '';
  return text
    .replace(/<[^>]+>/g, '')           // 移除 HTML 标签
    .replace(/[*_~`#]{1,3}/g, '')      // 移除 markdown 标记
    .replace(/---+/g, '')               // 移除分割线
    .replace(/\n{2,}/g, ' ')            // 多个换行合并
    .replace(/^\s*[-*+]\s/gm, '')       // 移除列表标记
    .replace(/^\s*\d+\.\s/gm, '')       // 移除行首编号（不碰句中的数字）
    .trim();
}

function renderConvItem(conv, collection) {
  const isExpanded = expandedConvs.has(conv.messageId);
  const isSelected = selectedConvs.has(conv.messageId);
  const q = conv.userQuestion || '(无用户提问)';
  const summary = stripMarkdown(conv.aiSummary || '');
  const sCount = conv.sentences.length;
  const modelShort = (conv.model || '').substring(0, 20);

  const sentencesHtml = conv.sentences.filter(s => s.type !== 'section').map(s => {
    const isSenSelected = selectedSentences.has(s.id);
    const tags = [];
    if (s.tags) tags.push(`<span class="sen-tag">${escHtml(s.tags)}</span>`);
    return `<div class="sentence-row" data-sid="${escAttr(s.id)}" data-lang="${escAttr(s.lang || 'ja')}">
      <input type="checkbox" class="md-checkbox" ${isSenSelected ? 'checked' : ''} title="勾选导出">
      <div class="sen-content">
        <div class="sen-ja">${renderContentWithRuby(s.content, s.ruby)}</div>
        <div class="sen-zh">${escHtml(s.translation)}</div>
        <div class="sen-tags">${tags.join('')}</div>
      </div>
      <span class="sen-lookup sen-mastered ${s.isMastered ? 'on' : ''}" data-act="mastered" title="${s.isMastered ? '取消已掌握' : '标记为已掌握'}"><span class="mi">${s.isMastered ? 'check_circle' : 'radio_button_unchecked'}</span></span>
      <span class="sen-lookup" data-act="lookup" title="分词查词典"><span class="mi">menu_book</span></span>
      <span class="sen-lookup" data-act="speak" title="只读这一句"><span class="mi">volume_up</span></span>
    </div>`;
  }).join('');

  const colBadge = collection ? `<div class="collection-badge"><span class="mi" style="font-size:12px">folder</span> ${escHtml(collection.title)}</div>` : '';

  return `<div class="conv-card ${isExpanded ? 'expanded' : ''} ${isSelected ? 'selected' : ''}" data-msg-id="${escAttr(conv.messageId)}" style="animation-delay:0ms">
    <div class="conv-card-header">
      <input type="checkbox" class="md-checkbox" ${isSelected ? 'checked' : ''} title="勾选导出">
      <div class="conv-card-body">
        ${colBadge}
        <div class="conv-question">${escHtml(q)}</div>
        ${summary ? `<div class="conv-summary">${escHtml(summary)}</div>` : ''}
        <div class="conv-card-meta">
          <span>${sCount} 句</span>
          ${modelShort ? `<span class="sen-tag">${escHtml(modelShort)}</span>` : ''}
        </div>
      </div>
      <div class="conv-card-actions">
        <button class="md-btn md-btn-text md-btn-sm" data-act="view" title="查看对话原文"><span class="mi">article</span>原文</button>
        <button class="md-btn md-btn-text md-btn-sm" data-act="exportconv" title="导出该对话为 Anki CSV"><span class="mi">file_download</span></button>
      </div>
    </div>
    <div class="conv-sentences"><div class="conv-sentences-inner">${sentencesHtml}</div></div>
  </div>`;
}

function scrollToSection(secId) {
  let el = document.getElementById(secId);
  if (!el) {
    if (!currentCollection || !currentCollection.hasSections) return;
    // 计算目标分栏在扁平列表中的页码
    const flatItems = buildSectionFlatItems(currentCollection.sections);
    // 找到目标分栏的索引
    const targetIdx = flatItems.findIndex(item => item.html.includes(`id="${secId}"`));
    const targetPage = Math.floor(targetIdx / PAGE_SIZE) + 1;
    const pager = document.getElementById('paginationBar');
    if (pager) pager.remove();
    _renderPageAt(flatItems, document.getElementById('convList'), (item) => item.html, targetPage);
    buildFullPlaylist();
    el = document.getElementById(secId);
  }
  if (!el) return;
  collapsedSections.delete(secId);
  el.classList.remove('collapsed');
  el.scrollIntoView({ behavior: 'instant', block: 'start' });
  // 更新导航高亮
  const idx = parseInt(secId.split('-')[1]);
  activeSectionIdx = idx;
  document.querySelectorAll('.section-nav .nav-chip').forEach((item, i) => item.classList.toggle('active', i === idx));
}

// ============================================================
// Interactions
// ============================================================
function toggleConv(msgId) {
  expandedConvs.has(msgId) ? expandedConvs.delete(msgId) : expandedConvs.add(msgId);
  // 局部更新，不重渲染整个列表（避免卡片动画重放）
  const card = document.querySelector(`#convList .conv-card[data-msg-id="${msgId}"]`);
  if (card) card.classList.toggle('expanded', expandedConvs.has(msgId));
}

function toggleSection(secId) {
  collapsedSections.has(secId) ? collapsedSections.delete(secId) : collapsedSections.add(secId);
  document.getElementById(secId)?.classList.toggle('collapsed');
}

function toggleConvSelect(msgId, checked) {
  // 在全部数据里找（跨收藏夹搜索时结果可能来自其他收藏夹）
  const conv = findConvAnywhere(msgId);
  if (checked) {
    selectedConvs.add(msgId);
    // 级联勾选该对话下所有句子
    if (conv) conv.sentences.forEach(s => { if (s.type !== 'section') selectedSentences.add(s.id); });
  } else {
    selectedConvs.delete(msgId);
    // 取消勾选时也取消该对话下所有句子
    if (conv) conv.sentences.forEach(s => selectedSentences.delete(s.id));
  }
  syncCardSelection(msgId);
  updateToolbar();
}

function toggleSentence(senId, checked) {
  checked ? selectedSentences.add(senId) : selectedSentences.delete(senId);
  updateToolbar();
}

function toggleSelectAll() {
  if (isCrossSearch) {
    // 跨收藏夹搜索：全选的是搜索结果，不是上次的收藏夹
    const results = window._searchResults || [];
    const allSelected = results.length > 0 && results.every(r => selectedConvs.has(r.conv.messageId));
    if (allSelected) {
      selectedConvs.clear();
      selectedSentences.clear();
    } else {
      results.forEach(r => {
        selectedConvs.add(r.conv.messageId);
        const orig = findConvAnywhere(r.conv.messageId);
        if (orig) orig.sentences.forEach(s => { if (s.type !== 'section') selectedSentences.add(s.id); });
      });
    }
  } else {
    const convs = currentCollection ? allConvs(currentCollection) : [];
    if (convs.length && selectedConvs.size >= convs.length) {
      selectedConvs.clear();
      selectedSentences.clear();
    } else {
      convs.forEach(c => {
        selectedConvs.add(c.messageId);
        c.sentences.filter(s => s.type !== 'section').forEach(s => selectedSentences.add(s.id));
      });
    }
  }
  syncAllSelectionUI();
  updateToolbar();
}

function deselectAll() {
  selectedConvs.clear(); selectedSentences.clear();
  syncAllSelectionUI();
  updateToolbar();
}

// 局部同步某个对话卡片的勾选 UI
function syncCardSelection(msgId) {
  const card = document.querySelector(`#convList .conv-card[data-msg-id="${msgId}"]`);
  if (!card) return;
  card.classList.toggle('selected', selectedConvs.has(msgId));
  const cb = card.querySelector('.conv-card-header .md-checkbox');
  if (cb) cb.checked = selectedConvs.has(msgId);
  card.querySelectorAll('.sentence-row').forEach(row => {
    const sid = row.dataset.sid;
    const scb = row.querySelector('.md-checkbox');
    if (scb && sid) scb.checked = selectedSentences.has(sid);
  });
}

function syncAllSelectionUI() {
  document.querySelectorAll('#convList .conv-card').forEach(card => {
    const mid = card.dataset.msgId;
    if (mid) syncCardSelection(mid);
  });
}

function updateToolbar() {
  // 徽标显示「实际会导出的句子数」，与导出结果一致
  const total = getSelectedSentences().length;
  ['btnExportAnki', 'btnExportCSV', 'btnExportTXT'].forEach(id => {
    document.getElementById(id).disabled = total === 0;
  });
  document.getElementById('btnExportAnki').innerHTML = total > 0 ? `<span class="mi">file_download</span>Anki (${total})` : '<span class="mi">file_download</span>Anki';
}

// ============================================================
// Modal with Markdown
// ============================================================
function viewConversation(msgId) {
  const conv = findConvAnywhere(msgId);
  if (!conv) return;
  window._viewingConv = conv;

  // 渲染 markdown 格式的 AI 回复
  const aiText = conv.aiAnswer || '';
  // 预处理：将 <lang code="ja">...</lang> 转为 markdown 友好的格式
  const processed = aiText
    .replace(/<lang\s+code="([^"]*)">([\s\S]*?)<\/lang>/gi, (_, code, text) => {
      return `\n<div class="lang-block" data-lang="${code}">${text.trim()}</div>\n`;
    });

  const mdHtml = marked.parse(processed);

  document.getElementById('modalBody').innerHTML = `
    <div class="user-q">
      <div class="label">👤 用户提问</div>

}

async function copyConvText() {
  const conv = window._viewingConv;
  if (!conv) return;
  const text = (conv.userQuestion ? conv.userQuestion + '\n\n' : '') + (conv.aiAnswer || '');
  try {
    await navigator.clipboard.writeText(text);
    snackbar('已复制全文', true);
  } catch {
    // 兜底：临时 textarea + execCommand
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); snackbar('已复制全文', true); } catch { snackbar('复制失败，请手动选择复制'); }
    document.body.removeChild(ta);
  }
}

function closeModal(e) {

  if (scrim.style.display === 'none') return;

    scrim.classList.remove('closing');
  }, 170);
}

function getSelectedSentences() {
  let all = [];
  if (isCrossSearch) {
    for (const col of DATA) {
      for (const conv of allConvs(col)) {
        const convSelected = selectedConvs.has(conv.messageId);
        for (const s of conv.sentences) {
          if ((convSelected || selectedSentences.has(s.id)) && s.type !== 'section') {
            all.push({ ...s, userQuestion: conv.userQuestion, collectionName: col.title });
          }
        }
      }
    }
  } else if (currentCollection) {
    for (const conv of allConvs(currentCollection)) {
      const convSelected = selectedConvs.has(conv.messageId);
      for (const s of conv.sentences) {
        if ((convSelected || selectedSentences.has(s.id)) && s.type !== 'section') {
          all.push({ ...s, userQuestion: conv.userQuestion, collectionName: currentCollection.title });
        }
      }
    }
  }
  return all;
}

  return 'ocat_' + t;
}
function dateStamp() {

  return `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}`;

// ============================================================
// Playback（数据驱动播放列表：跨分页、跨收藏夹视图统一管理）
// ============================================================
let speechRate = parseFloat(store.get('rate', '1.25')) || 1.25;
let speechMode = store.get('mode', 'loop') === 'shuffle' ? 'shuffle' : 'loop';
let currentSpeechIndex = -1;
let isPlaying = false;
let speechVoices = [];
let selectedVoiceURI = store.get('voice', '');
window.fullPlaylist = [];      // [{id, content, lang, page, row}]，page/row 用于定位高亮
window._shuffleRecent = [];    // 随机模式最近播过的索引，避免连续重复

// 预加载语音列表
speechSynthesis.onvoiceschanged = () => { speechVoices = speechSynthesis.getVoices(); updateVoiceSelector(); };
speechVoices = speechSynthesis.getVoices();

function langToBcp47(lang) {
  return lang === 'ja' ? 'ja-JP' : lang === 'en' ? 'en-US' : lang === 'zh' ? 'zh-CN' : (lang || 'ja-JP');
}

function getVoiceForLang(lang) {
  if (selectedVoiceURI) { const v = speechVoices.find(v => v.voiceURI === selectedVoiceURI); if (v) return v; }
  const prefix = lang === 'ja' ? 'ja' : lang === 'en' ? 'en' : lang === 'zh' ? 'zh' : lang;
  return speechVoices.find(v => v.lang.startsWith(prefix)) || null;
}

function updateVoiceSelector() {
  const sel = document.getElementById('voiceSelect');
  if (!sel) return;
  sel.innerHTML = '<option value="">自动</option>' +
    speechVoices.map(v => `<option value="${v.voiceURI}" ${v.voiceURI === selectedVoiceURI ? 'selected' : ''}>${v.name} (${v.lang})</option>`).join('');
}

// 由当前渲染数据构建整表播放列表（与分页无关，跨页/随机都基于它）
function buildFullPlaylist() {
  const items = window.currentRenderItems || [];
  const list = [];
  const totalPages = Math.ceil(items.length / PAGE_SIZE) || 1;
  for (let p = 1; p <= totalPages; p++) {
    const start = (p - 1) * PAGE_SIZE;
    const end = Math.min(start + PAGE_SIZE, items.length);
    let row = 0;
    for (let i = start; i < end; i++) {
      const conv = items[i] && items[i].conv;
      if (!conv) continue;
      for (const s of conv.sentences) {
        if (s.type === 'section') continue;
        list.push({ id: s.id, content: s.content || '', lang: s.lang || 'ja', page: p, row });
        row++;
      }
    }
  }
  window.fullPlaylist = list;
  return list;
}

// 由行元素反查播放列表索引
function playlistIndexOfRow(row) {
  if (!window.fullPlaylist || !window.fullPlaylist.length) buildFullPlaylist();
  const list = window.fullPlaylist || [];
  const sid = row.dataset.sid;
  if (sid) {
    const i = list.findIndex(it => String(it.id) === sid);
    if (i >= 0) return i;
  }
  const rowIdx = Array.from(document.querySelectorAll('#convList .sentence-row')).indexOf(row);
  const item = list.find(it => it.page === currentPage && it.row === rowIdx);
  return item ? list.indexOf(item) : -1;
}

// 点击句子文字：仅播放中生效（跳到这句）；停止时不动作，方便划选取词
function onRowClick(e) {
  if (!isPlaying) return;
  const sel = window.getSelection();
  if (sel && sel.toString().trim()) return;   // 正在划选文字 → 交给查词弹窗
  const row = e.target.closest('.sentence-row');
  if (!row) return;
  const idx = playlistIndexOfRow(row);
  if (idx < 0) return;
  currentSpeechIndex = idx;
  speakCurrent();
}

// 🔊：只读这一句（播放中时改为跳到该句继续连播）
function speakOnceFromRow(e) {
  if (isPlaying) { onRowClick(e); return; }
  const row = e.target.closest('.sentence-row');
  if (!row) return;
  const ja = row.querySelector('.sen-ja');
  if (!ja || !('speechSynthesis' in window)) return;
  const idx = playlistIndexOfRow(row);
  if (idx >= 0) currentSpeechIndex = idx;   // 之后按播放/空格可从这句接续
  const lang = row.dataset.lang || 'ja';
  const synth = window.speechSynthesis;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(cleanRubyText(ja));
  u.lang = langToBcp47(lang);
  const voice = getVoiceForLang(lang);
  if (voice) u.voice = voice;
  u.rate = speechRate;
  synth.speak(u);
}

function pickShuffle() {
  const n = (window.fullPlaylist || []).length;
  if (n <= 1) return 0;
  const recent = window._shuffleRecent || (window._shuffleRecent = []);
  let idx, guard = 0;
  do { idx = Math.floor(Math.random() * n); } while (recent.includes(idx) && guard++ < 50);
  recent.push(idx);
  const keep = Math.min(n - 1, 10);
  while (recent.length > keep) recent.shift();
  return idx;
}

function speakCurrent() {
  const list = window.fullPlaylist || [];
  const item = list[currentSpeechIndex];
  if (!item) { isPlaying = false; updatePlayBtn(); return; }
  if (!('speechSynthesis' in window)) { snackbar('浏览器不支持语音合成'); return; }
  const synth = window.speechSynthesis;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(item.content);
  u.lang = langToBcp47(item.lang);
  const voice = getVoiceForLang(item.lang);
  if (voice) u.voice = voice;
  u.rate = speechRate;
  u.onend = () => {
    if (!isPlaying) return;
    const n = (window.fullPlaylist || []).length;
    if (!n) { isPlaying = false; updatePlayBtn(); return; }
    if (speechMode === 'shuffle') currentSpeechIndex = pickShuffle();
    else currentSpeechIndex = (currentSpeechIndex + 1) % n;   // 列表循环：跨页循环
    highlightCurrentSentence();
    speakCurrent();
  };
  synth.speak(u);
  highlightCurrentSentence();
}

function highlightCurrentSentence(clear) {
  document.querySelectorAll('#convList .sentence-row.playing').forEach(el => el.classList.remove('playing'));
  const item = (window.fullPlaylist || [])[currentSpeechIndex];
  if (clear || !item) return;
  // 高亮句子不在当前页时，自动翻到对应页
  if (item.page !== currentPage) {
    _renderPageAt(window.currentRenderItems, document.getElementById('convList'), window.currentRenderer, item.page);
  }
  const rows = document.querySelectorAll('#convList .sentence-row');
  const row = document.querySelector(`#convList .sentence-row[data-sid="${item.id}"]`) || rows[item.row];
  if (!row) return;
  // 自动展开所在分栏（折叠状态下高亮不可见）
  const group = row.closest('.section-group');
  if (group && group.classList.contains('collapsed')) {
    group.classList.remove('collapsed');
    collapsedSections.delete(group.id);
  }
  // 自动展开父对话卡片
  const card = row.closest('.conv-card');
  if (card && !card.classList.contains('expanded')) {
    const msgId = card.dataset.msgId;
    if (msgId) { expandedConvs.add(msgId); card.classList.add('expanded'); }
  }
  row.classList.add('playing');
  row.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function cleanRubyText(el) {
  // 移除注音（原生 ruby rt 与自定义 .rt），只保留正文
  const clone = el.cloneNode(true);
  clone.querySelectorAll('rt, .rt').forEach(rt => rt.remove());
  return clone.textContent.replace(/[\s\n]+/g, ' ').trim();
}

function togglePlay() {
  const synth = window.speechSynthesis;
  if (synth.paused) { synth.resume(); isPlaying = true; updatePlayBtn(); return; }
  if (isPlaying) { synth.pause(); isPlaying = false; updatePlayBtn(); return; }
  playAll();
}

function skipPrev() {
  buildFullPlaylist();
  const n = window.fullPlaylist.length;
  if (!n) { snackbar('当前列表没有句子'); return; }
  currentSpeechIndex = speechMode === 'shuffle' ? pickShuffle() : (currentSpeechIndex - 1 + n) % n;
  if (!isPlaying) { isPlaying = true; updatePlayBtn(); }
  speakCurrent();
}

function skipNext() {
  buildFullPlaylist();
  const n = window.fullPlaylist.length;
  if (!n) { snackbar('当前列表没有句子'); return; }
  currentSpeechIndex = speechMode === 'shuffle' ? pickShuffle() : (currentSpeechIndex + 1) % n;
  if (!isPlaying) { isPlaying = true; updatePlayBtn(); }
  speakCurrent();
}

function playAll() {
  buildFullPlaylist();
  const n = window.fullPlaylist.length;
  if (!n) { snackbar('当前列表没有句子'); return; }
  if (currentSpeechIndex < 0 || currentSpeechIndex >= n) currentSpeechIndex = 0;
  isPlaying = true;
  updatePlayBtn();
  speakCurrent();
}

function stopSpeech() {
  window.speechSynthesis.cancel();
  isPlaying = false;
  document.querySelectorAll('#convList .sentence-row.playing').forEach(el => el.classList.remove('playing'));
  updatePlayBtn();
}

function updatePlayBtn() {
  const btn = document.getElementById('playBtn');
  if (btn) {
    if (window.speechSynthesis.paused) { btn.innerHTML = '<span class="mi">play_arrow</span>'; btn.title = '继续'; }
    else if (isPlaying) { btn.innerHTML = '<span class="mi">pause</span>'; btn.title = '暂停'; }
    else { btn.innerHTML = '<span class="mi">play_arrow</span>'; btn.title = '播放'; }
  }
}

function cycleMode() {
  const modes = ['loop', 'shuffle'];
  speechMode = modes[(modes.indexOf(speechMode) + 1) % modes.length];
  window._shuffleRecent = [];
  store.set('mode', speechMode);
  const btn = document.getElementById('modeBtn');
  btn.innerHTML = speechMode === 'loop' ? '<span class="mi">repeat</span>' : '<span class="mi">shuffle</span>';
  btn.title = speechMode === 'loop' ? '列表循环' : '随机播放（跨页、不重复）';
}

// 从句子行发起查词（读取行内文本，避免行内事件传参的转义问题）
function lookupFromRow(e) {
  const row = e.target.closest('.sentence-row');
  if (!row) return;
  const ja = row.querySelector('.sen-ja');
  lookupWord(ja ? cleanRubyText(ja) : '');
}

function lookupWord(sentence) {
  document.querySelectorAll('.pitch-popup').forEach(el => el.remove());
  const isJapanese = /[\u3040-\u309f\u30a0-\u30ff\u4e00-\u9fff]/.test(sentence);
  if (isJapanese) { lookupJapanese(sentence); } else { lookupEnglish(sentence); }
}

async function lookupJapanese(sentence) {
  let words = [];
  // 尝试 kuromoji（支持词形还原）
  if (typeof kuromoji !== 'undefined' && window._kuromojiTokenizer) {
    const tokens = window._kuromojiTokenizer.tokenize(sentence);
    words = tokens
      .filter(t => t.pos !== '助詞' && t.pos !== '助動詞' && t.pos !== '記号' && t.surface_form.length >= 1)
      .map(t => {
        const base = t.basic_form !== '*' && t.basic_form !== t.surface_form ? t.basic_form : null;
        return { word: t.surface_form, base };
      });
  } else if (typeof TinySegmenter !== 'undefined') {
    const seg = new TinySegmenter();
    words = seg.segment(sentence)
      .filter(w => w.length >= 1 && !/^[、。，．！？\s　.,!?\n]+$/.test(w))
      .map(w => ({ word: w, base: null }));
  } else {
    words = sentence.split(/[、。，．！？\s　.,!?\n]+/).filter(w => w.length > 0).map(w => ({ word: w, base: null }));
  }

  // 去重，优先保留有 base 的
  const seen = new Set();
  const uniqueWords = [];
  for (const w of words) {
    if (!seen.has(w.word)) { seen.add(w.word); uniqueWords.push(w); }
  }

  document.getElementById('modalBody').innerHTML = `
    <div style="font:var(--md-sys-typescale-label-small);color:var(--md-sys-color-on-surface-variant);margin-bottom:12px">
      点击单词跳转词典 · 也可以手动划选句子中的文字
    </div>
    ${uniqueWords.slice(0, 30).map(({word, base}) => {
      const enc = encodeURIComponent(word);
      const baseEnc = base ? encodeURIComponent(base) : enc;
      return `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--md-sys-color-outline-variant)">
        <span style="font-family:var(--font-ja);font-size:16px;flex:1">
          ${escHtml(word)}${base ? ` <span style="font-size:12px;color:var(--md-sys-color-on-surface-variant)">← ${escHtml(base)}</span>` : ''}
        </span>
        <a href="https://jisho.org/search/${base ? baseEnc : enc}" target="_blank" class="md-btn md-btn-text md-btn-sm" style="font-size:11px"><span class="mi" style="font-size:14px">menu_book</span>Jisho</a>
        <a href="http://www.gavo.t.u-tokyo.ac.jp/ojad/search/index/word:${base ? baseEnc : enc}" target="_blank" class="md-btn md-btn-text md-btn-sm" style="font-size:11px"><span class="mi" style="font-size:14px">graphic_eq</span>OJAD</a>
      </div>`;
    }).join('')}
    <div style="margin-top:12px;font:var(--md-sys-typescale-label-small);color:var(--md-sys-color-on-surface-variant)">
      💡 提示：也可以直接划选句子中的文字，弹出快捷查询
    </div>`;
  document.getElementById('modalOverlay').style.display = 'flex';
}

function lookupEnglish(sentence) {
  const words = sentence.split(/[\s.,!?;:'"()\[\]{}]+/).filter(w => w.length > 1);
  const uniqueWords = [...new Set(words)].slice(0, 20);

  document.getElementById('modalBody').innerHTML = `
    <div style="font:var(--md-sys-typescale-label-small);color:var(--md-sys-color-on-surface-variant);margin-bottom:12px">
      点击单词跳转词典
    </div>
    ${uniqueWords.map(w => {
      const enc = encodeURIComponent(w);
      return `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--md-sys-color-outline-variant)">
        <span style="font-size:16px;flex:1">${escHtml(w)}</span>
        <a href="https://www.merriam-webster.com/dictionary/${enc}" target="_blank" class="md-btn md-btn-text md-btn-sm" style="font-size:11px"><span class="mi" style="font-size:14px">menu_book</span>MW</a>
        <a href="https://dictionary.cambridge.org/dictionary/english/${enc}" target="_blank" class="md-btn md-btn-text md-btn-sm" style="font-size:11px"><span class="mi" style="font-size:14px">translate</span>剑桥</a>
        <a href="https://youglish.com/pronounce/${enc}/english" target="_blank" class="md-btn md-btn-text md-btn-sm" style="font-size:11px"><span class="mi" style="font-size:14px">graphic_eq</span>YouGlish</a>
      </div>`;
    }).join('')}`;
  document.getElementById('modalOverlay').style.display = 'flex';
}

// 文字划选快捷查询（状态机：修复「取消选中后弹框又出现」）
let _selPopup = null;
let _suppressPopup = false;
let _closedSelText = '';

function closeSelPopup() {
  if (_selPopup) { _selPopup.remove(); _selPopup = null; }
}

document.addEventListener('mousedown', (e) => {
  if (_selPopup) {
    if (!_selPopup.contains(e.target)) {
      _closedSelText = (window.getSelection() ? window.getSelection().toString() : '').trim();
      closeSelPopup();
      // 这次点击既关掉了弹窗，也可能折叠了旧选区：本次 mouseup 不再弹
      _suppressPopup = true;
    }
  } else {
    _suppressPopup = false;   // 全新的一次交互
  }
});

document.addEventListener('mouseup', function(e) {
  const zone = e.target.closest && (e.target.closest('.sentence-row') || e.target.closest('#modalBody'));
  if (!zone) return;
  const sel = window.getSelection();
  const text = sel ? sel.toString().trim() : '';
  if (!text || text.length > 30) return;      // 无选区（含已取消选中）
  if (_suppressPopup) {
    _suppressPopup = false;
    if (text === _closedSelText) return;      // 仍是刚被关闭时的旧选区 → 不弹
  }

  closeSelPopup();
  const enc = encodeURIComponent(text);
  const isJapanese = /[\u3040-\u309f\u30a0-\u30ff\u4e00-\u9fff]/.test(text);

  const popup = document.createElement('div');
  popup.className = 'pitch-popup';
  if (isJapanese) {
    popup.innerHTML = `
      <div class="popup-word">${escHtml(text)}</div>
      <a href="https://jisho.org/search/${enc}" target="_blank" rel="noopener"><span class="mi" style="font-size:16px">menu_book</span>Jisho 词典</a>
      <a href="http://www.gavo.t.u-tokyo.ac.jp/ojad/search/index/word:${enc}" target="_blank" rel="noopener"><span class="mi" style="font-size:16px">graphic_eq</span>OJAD 音调</a>`;
  } else {
    popup.innerHTML = `
      <div class="popup-word">${escHtml(text)}</div>
      <a href="https://www.merriam-webster.com/dictionary/${enc}" target="_blank" rel="noopener"><span class="mi" style="font-size:16px">menu_book</span>Merriam-Webster</a>
      <a href="https://dictionary.cambridge.org/dictionary/english/${enc}" target="_blank" rel="noopener"><span class="mi" style="font-size:16px">translate</span>Cambridge</a>
      <a href="https://youglish.com/pronounce/${enc}/english" target="_blank" rel="noopener"><span class="mi" style="font-size:16px">graphic_eq</span>YouGlish</a>`;
  }
  if (e.target.closest('#modalBody')) popup.style.position = 'fixed';
  popup.style.top = Math.min(e.clientY + 8, window.innerHeight - 180) + 'px';
  popup.style.left = Math.min(e.clientX, window.innerWidth - 220) + 'px';
  document.body.appendChild(popup);
  _selPopup = popup;
});

// ============================================================
// Utilities
// ============================================================
function rubyToBrackets(html) {
  if (!html) return '';
  return html.replace(/<ruby[^>]*>(.*?)<rt>(.*?)<\/rt><\/ruby>/g, '$1[$2]').replace(/<[^>]+>/g, '').trim();
}

// ===== 注音渲染：读音按拍拆分、逐字悬浮在对应汉字上方 =====
// 背景：app 存的是整词注音（如 一朝一夕[いっちょういっせき]），整块居中会让
// 假名和汉字对不上（错位）；逐字分配后每个汉字头上的假名与其对应，且
// 绝对定位不参与排版，正文间距完全自然。
const SMALL_KANA = 'ぁぃぅぇぉっゃゅょゎァィゥェォッャュョ';
const KANJI_RE = /[\u3400-\u4dbf\u4e00-\u9fff々]/;

// 读音切拍：小書き仮名（ゃゅょっ等）并进前一拍
function splitMorae(reading) {
  const morae = [];
  for (const ch of reading) {
    if (morae.length && SMALL_KANA.includes(ch)) morae[morae.length - 1] += ch;
    else morae.push(ch);
  }
  return morae;
}

// 把读音按比例分配到 base 的每个汉字：返回 [{char, rt}]
function distributeReading(base, reading) {
  const chars = [...base];
  const isKanji = chars.map(c => KANJI_RE.test(c));
  const n = isKanji.filter(Boolean).length;
  if (!n || !reading) return chars.map(c => ({ char: c, rt: '' }));
  const morae = splitMorae(reading);
  const m = morae.length;
  if (!m) return chars.map(c => ({ char: c, rt: '' }));
  const perKanji = [];
  let consumed = 0;
  for (let k = 0; k < n; k++) {
    const take = Math.round((k + 1) * m / n) - Math.round(k * m / n);
    perKanji.push(morae.slice(consumed, consumed + take).join(''));
    consumed += take;
  }
  if (consumed < m) perKanji[n - 1] += morae.slice(consumed).join('');
  let ki = 0;
  return chars.map(c => KANJI_RE.test(c)
    ? { char: c, rt: perKanji[ki++] || '' }
    : { char: c, rt: '' });
}

// 将 漢字[かんじ] 格式转为逐字悬浮注音 HTML
function bracketsToRuby(text) {
  if (!text) return '';
  return text.replace(/([^\]]+?)\[([^\]]+)\]/g, (m, base, reading) =>
    distributeReading(base, reading).map(({ char, rt }) =>
      rt ? `<span class="rb">${escHtml(char)}<span class="rt">${escHtml(rt)}</span></span>` : escHtml(char)
    ).join('')
  );
}

// 为句子生成带注音的 HTML
function renderContentWithRuby(content, ruby) {
  if (!ruby) return escHtml(content);
  // 用括号格式注音在汉字上方显示
  return bracketsToRuby(escHtml(ruby));
}

function escHtml(s) {
  if (s === null || s === undefined || s === '') return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function escAttr(s) { return escHtml(s).replace(/'/g, '&#39;'); }

function downloadFile(content, filename, mimeType) {
  const blob = new Blob(['\uFEFF' + content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function debounce(fn, delay) {
  let timer;
  return function(...args) { clearTimeout(timer); timer = setTimeout(() => fn.apply(this, args), delay); };
}

let snackTimer;
function snackbar(msg, success) {
  const el = document.getElementById('snackbar');
  el.textContent = (success ? '✅ ' : '') + msg;
  el.style.display = 'block';
  el.classList.remove('hiding');
  clearTimeout(window._snackTimer);
  // 鼠标悬浮不消失，点击立即关闭
  el.onmouseenter = () => clearTimeout(window._snackTimer);
  el.onmouseleave = () => { clearTimeout(window._snackTimer); window._snackTimer = setTimeout(() => hideSnackbar(), 2500); };
  el.onclick = () => hideSnackbar();
  window._snackTimer = setTimeout(() => hideSnackbar(), 2500);
}

function hideSnackbar() {
  const el = document.getElementById('snackbar');
  if (!el || el.style.display === 'none') return;
  el.classList.add('hiding');
  setTimeout(() => { el.style.display = 'none'; el.classList.remove('hiding'); }, 400);
}

// Keyboard
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { closeModal(); return; }
  const tag = (document.activeElement && document.activeElement.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;   // 输入中不抢快捷键
  if (e.ctrlKey && e.key === 'a') { e.preventDefault(); toggleSelectAll(); return; }
  if (document.getElementById('modalOverlay').style.display !== 'none') return;
  if (e.key === '/') {
    const si = document.getElementById('searchInput');
    if (!si.disabled) { e.preventDefault(); si.focus(); }
  } else if (e.code === 'Space') {
    e.preventDefault(); togglePlay();
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault(); skipPrev();
  } else if (e.key === 'ArrowRight') {
    e.preventDefault(); skipNext();
  }
});

// Search events
document.getElementById('searchInput').addEventListener('input', debounce(onSearch, 200));
document.getElementById('searchField').addEventListener('change', onSearch);
document.getElementById('searchScope').addEventListener('change', onSearch);

// ===== 列表事件委托（整表只挂少量监听器，替代行内 onclick）=====
(function setupDelegation() {
  const convList = document.getElementById('convList');
  convList.addEventListener('click', (e) => {
    const actEl = e.target.closest('[data-act]');
    if (actEl) {
      const act = actEl.dataset.act;
      if (act === 'lookup') return lookupFromRow(e);
      if (act === 'speak') return speakOnceFromRow(e);
      if (act === 'mastered') {
        const row = actEl.closest('.sentence-row');
        if (row) toggleMastered(row.dataset.sid);
        return;
      }
      const card = actEl.closest('.conv-card');
      if (act === 'view' && card) return viewConversation(card.dataset.msgId);
      if (act === 'exportconv' && card) return exportConvAnki(card.dataset.msgId);
      return;
    }
    if (e.target.closest('input[type=checkbox]')) return;   // 勾选由 change 事件处理
    const secHead = e.target.closest('.section-group-header');
    if (secHead) { toggleSection(secHead.parentElement.id); return; }
    const header = e.target.closest('.conv-card-header');
    if (header) { toggleConv(header.closest('.conv-card').dataset.msgId); return; }
    const row = e.target.closest('.sentence-row');
    if (row) onRowClick(e);
  });
  convList.addEventListener('change', (e) => {
    const cb = e.target;
    if (cb.type !== 'checkbox') return;
    const senRow = cb.closest('.sentence-row');
    if (senRow) { toggleSentence(senRow.dataset.sid, cb.checked); return; }
    const header = cb.closest('.conv-card-header');
    if (header) toggleConvSelect(header.closest('.conv-card').dataset.msgId, cb.checked);
  });
  // 导航栏收藏夹
  document.getElementById('navRail').addEventListener('click', (e) => {
    const item = e.target.closest('.nav-rail-item');
    if (item) selectCollection(parseInt(item.dataset.idx, 10));
  });
  // 分栏快速跳转
  document.getElementById('sectionNav').addEventListener('click', (e) => {
    const chip = e.target.closest('.nav-chip');
    if (chip && chip.dataset.sec) scrollToSection(chip.dataset.sec);
  });
  // 分页按钮
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('#paginationBar [data-page]');
    if (btn) goToPage(btn.dataset.page);
  });
  // 收藏夹搜索
  const navSearch = document.getElementById('navSearch');
  navSearch.addEventListener('input', debounce(() => filterNavCollections(navSearch.value), 120));
  navSearch.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { navSearch.value = ''; filterNavCollections(''); navSearch.blur(); }
  });
})();

// ===== 标记已掌握（写回内存数据库，💾 保存后持久化到文件）=====
let _masteredCacheTimer = null;
function toggleMastered(sid) {
  if (!db) { snackbar('请先加载数据库'); return; }
  let item = null;
  outer:
  for (const col of DATA) {
    for (const conv of allConvs(col)) {
      for (const s of conv.sentences) {
        if (String(s.id) === String(sid)) { item = s; break outer; }
      }
    }
  }
  if (!item) return;
  const newVal = item.isMastered ? 0 : 1;
  try {
    db.run('UPDATE Collection SET isMastered = ? WHERE id = ?', [newVal, item.id]);
  } catch (err) { snackbar('写入失败: ' + err.message); return; }
  item.isMastered = !!newVal;
  document.querySelectorAll(`#convList .sentence-row[data-sid="${CSS.escape(String(sid))}"] .sen-lookup[data-act="mastered"]`).forEach(btn => {
    btn.classList.toggle('on', !!newVal);
    btn.title = newVal ? '取消已掌握' : '标记为已掌握';
    btn.querySelector('.mi').textContent = newVal ? 'check_circle' : 'radio_button_unchecked';
  });
  dbDirty = true;
  setDbChip(dbFileName || '已加载', true);
  snackbar(newVal ? '已标记为已掌握，记得点击保存' : '已取消掌握', true);
  // 防抖写缓存：刷新后「未保存」状态与勾选结果都能恢复
  clearTimeout(_masteredCacheTimer);
  _masteredCacheTimer = setTimeout(() => cacheData(dbFileName || 'OCAT.db', true), 3000);
}

// Sidebar resize
(function() {
  const rail = document.getElementById('navRail');
  const resizer = document.getElementById('navResizer');
  // 恢复上次的宽度
  const savedW = parseInt(store.get('navw', '0'), 10);
  if (savedW >= 60 && savedW <= 300) rail.style.width = savedW + 'px';
  let startX, startWidth;
  resizer.addEventListener('mousedown', (e) => {
    startX = e.clientX;
    startWidth = rail.offsetWidth;
    resizer.classList.add('active');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    const onMove = (e) => {
      const w = Math.max(60, Math.min(300, startWidth + e.clientX - startX));
      rail.style.width = w + 'px';
    };
    const onUp = () => {
      resizer.classList.remove('active');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      store.set('navw', rail.offsetWidth);
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
})();

// 深浅色模式切换（三态：跟随系统 → 明/暗 → 跟随系统，选择会记住）
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  let next;
  if (!current) { next = prefersDark ? 'light' : 'dark'; }
  else if (current === 'dark') { next = 'light'; }
  else { html.removeAttribute('data-theme'); store.set('theme', ''); updateThemeIcon(); return; }
  html.setAttribute('data-theme', next);
  store.set('theme', next);
  updateThemeIcon();
}
function updateThemeIcon() {
  const t = document.documentElement.getAttribute('data-theme');
  const btn = document.getElementById('themeBtn');
  if (btn) {
    btn.innerHTML = t === 'dark' ? '<span class="mi">light_mode</span>'
      : t === 'light' ? '<span class="mi">dark_mode</span>'
      : '<span class="mi">brightness_auto</span>';
    btn.title = t === 'dark' ? '深色模式（点击切换）' : t === 'light' ? '浅色模式（点击恢复跟随系统）' : '跟随系统（点击切换）';
  }
}

// ===== 皮肤切换（Material / 液态玻璃）=====
function toggleSkin() {
  const isGlass = document.documentElement.getAttribute('data-skin') === 'glass';
  if (isGlass) document.documentElement.removeAttribute('data-skin');
  else document.documentElement.setAttribute('data-skin', 'glass');
  store.set('skin', isGlass ? 'material' : 'glass');
  updateSkinIcon();
  snackbar(isGlass ? '已切换到 Material 风格' : '已切换到液态玻璃风格', true);
}
function updateSkinIcon() {
  const btn = document.getElementById('skinBtn');
  if (!btn) return;
  const isGlass = document.documentElement.getAttribute('data-skin') === 'glass';
  btn.innerHTML = isGlass ? '<span class="mi">blur_on</span>' : '<span class="mi">layers</span>';
  btn.title = isGlass ? '当前：液态玻璃（点击切换到 Material）' : '当前：Material（点击切换到液态玻璃）';
}

// ===== 界面缩放（4K 大屏适配）=====
function applyZoom(z) {
  const v = parseFloat(z) || 1;
  document.documentElement.style.zoom = v === 1 ? '' : String(v);
  store.set('zoom', String(v));
  // zoom 会等比放大 100vh 定高的内容，需要等比缩小才能恰好占满视口
  document.body.style.height = v === 1 ? '' : (100 / v) + 'vh';
  const sel = document.getElementById('zoomSelect');
  if (sel && sel.value !== String(v)) sel.value = String(v);
}
(function initZoom() {
  const sel = document.getElementById('zoomSelect');
  const cur = document.documentElement.style.zoom || '1';
  if (sel) {
    if (![...sel.options].some(o => o.value === cur)) {
      // 无匹配档位时以 100% 显示（缩放值仍保留）
      sel.value = '1';
    } else sel.value = cur;
  }
  // 补偿 vh（head 早期应用时 body 可能还没就绪，这里统一处理）
  const v = parseFloat(cur) || 1;
  if (v !== 1) document.body.style.height = (100 / v) + 'vh';
})();

updateThemeIcon();
updateSkinIcon();
</script>
